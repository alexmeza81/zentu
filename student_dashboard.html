<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZentU — Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"
    integrity="sha384-2zrRDgDHSYB/GN3nFW3fsZXoxEhKIr3N2h63Tc6DEOB9JJdFIu8xMJT2Cph/gBil"
    crossorigin="anonymous"></script>
  <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #F0F2FF; min-height: 100vh; }

  .app-shell { max-width: 430px; margin: 0 auto; min-height: 100vh; background: #F0F2FF; position: relative; display: flex; flex-direction: column; }

  /* Top bar */
  .topbar { position: sticky; top: 0; z-index: 20; background: rgba(240,242,255,0.92); backdrop-filter: blur(12px); padding: 14px 20px 10px; display: flex; align-items: center; justify-content: space-between; }
  .topbar-logo { display: flex; align-items: center; gap: 8px; }
  .logo-icon { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg,#7B68EE,#4A9EFF); display: flex; align-items: center; justify-content: center; }
  .topbar-greeting { font-size: 16px; font-weight: 800; color: #0F172A; letter-spacing: -0.02em; }
  .topbar-bell { width: 36px; height: 36px; border-radius: 12px; background: #fff; border: 1px solid #E2E8F0; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
  .notif-dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 999px; background: #EF4444; border: 2px solid #F0F2FF; }

  /* Scroll */
  .scroll-content { flex: 1; overflow-y: auto; padding: 0 0 90px; }

  /* Sections */
  .section { display: none; }
  .section.active { display: block; }

  /* Bottom nav */
  .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); border-top: 1px solid rgba(0,0,0,0.06); display: flex; z-index: 30; padding: 8px 0 max(8px, env(safe-area-inset-bottom)); }
  .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; cursor: pointer; transition: all 0.2s; }
  .nav-tab .tab-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 8px; transition: all 0.2s; }
  .nav-tab .tab-label { font-size: 10px; font-weight: 600; color: #94A3B8; transition: color 0.2s; }
  .nav-tab.active .tab-icon { background: linear-gradient(135deg,#7B68EE,#4A9EFF); }
  .nav-tab.active .tab-icon svg { color: #fff !important; }
  .nav-tab:not(.active) .tab-icon svg { color: #94A3B8; }
  .nav-tab.active .tab-label { color: #7B68EE; font-weight: 700; }
  .nav-badge-wrap { position: relative; }
  .nav-badge-wrap .badge { position: absolute; top: -4px; right: -6px; min-width: 16px; height: 16px; border-radius: 999px; background: #EF4444; color: #fff; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 3px; }

  /* Cards */
  .card { background: #fff; border-radius: 18px; border: 1px solid rgba(0,0,0,0.05); overflow: hidden; }
  .section-title { font-size: 13px; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 0.06em; padding: 20px 20px 8px; }
  .section-desc { font-size: 12.5px; color: #94A3B8; line-height: 1.5; padding: 0 20px 10px; }
  .section-desc strong { color: #7B68EE; font-weight: 700; }

  /* Profile hero */
  .profile-hero { margin: 16px 20px 0; border-radius: 20px; padding: 20px; position: relative; overflow: hidden; isolation: isolate; background: linear-gradient(135deg,#7B68EE 0%,#4A9EFF 100%); }
  .hero-theme-btn { position: absolute; top: 12px; right: 12px; z-index: 4; width: 32px; height: 32px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.28); background: rgba(255,255,255,0.16); backdrop-filter: blur(6px); color: #fff; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .hero-theme-btn:active { transform: scale(0.94); }
  /* Temas del hero */
  .profile-hero.t-aurora { background: #0C0A28; }
  .profile-hero.t-aurora::before { content: ''; position: absolute; inset: -25%; z-index: 0; filter: blur(14px); background: radial-gradient(circle at 12% 18%, rgba(139,92,246,0.95), transparent 42%), radial-gradient(circle at 88% 12%, rgba(59,130,246,0.85), transparent 42%), radial-gradient(circle at 78% 92%, rgba(236,72,153,0.7), transparent 42%), radial-gradient(circle at 15% 95%, rgba(45,212,191,0.6), transparent 42%); }
  .profile-hero.t-midnight { background: radial-gradient(130% 120% at 82% -10%, #322A78 0%, #1A153F 52%, #120E30 100%); border: 1px solid rgba(255,255,255,0.09); }
  .profile-hero.t-monogram { background: linear-gradient(135deg,#6D5AE6,#4A9EFF); }
  .profile-hero.t-monogram::before { content: ''; position: absolute; inset: 0; z-index: 0; opacity: 0.14; background-image: radial-gradient(circle,#fff 1.1px,transparent 1.4px); background-size: 15px 15px; }
  .profile-hero.t-monogram::after { content: 'Z'; position: absolute; right: -8px; bottom: -40px; z-index: 0; font-weight: 900; font-size: 170px; color: rgba(255,255,255,0.10); line-height: 1; }
  /* Selector de tema */
  .theme-row { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid #E2E8F0; border-radius: 14px; margin-bottom: 10px; cursor: pointer; background: #fff; }
  .theme-row:active { background: #F5F7FF; }
  .theme-swatch { width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.06); }
  .theme-name { font-size: 14px; font-weight: 800; color: #0F172A; }
  .theme-desc { font-size: 12px; color: #64748B; margin-top: 1px; }
  .theme-check { color: #7B68EE; font-weight: 900; font-size: 18px; }

  /* Onboarding progress card */
  .progress-card { margin: 16px 20px 0; background: linear-gradient(135deg,#7B68EE,#4A9EFF); border-radius: 20px; padding: 18px 20px; color: #fff; }
  .progress-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .progress-title { font-size: 14px; font-weight: 800; }
  .progress-pct { font-size: 22px; font-weight: 900; }
  .progress-track { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.25); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 999px; background: #fff; transition: width 0.4s cubic-bezier(0.22,1,0.36,1); }
  .progress-copy { font-size: 12.5px; color: rgba(255,255,255,0.9); margin-top: 12px; line-height: 1.5; }
  .progress-cta { margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; background: #fff; color: #4A2FD6; font-size: 13px; font-weight: 800; cursor: pointer; border: none; }
  .progress-cta:active { transform: scale(0.97); }
  .progress-done { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; font-weight: 800; }
  /* Secciones checklist */
  .psec-row { display: flex; align-items: center; gap: 12px; padding: 13px 20px; border-bottom: 1px solid #F8FAFC; cursor: pointer; transition: background 0.1s; }
  .psec-row:last-child { border-bottom: none; }
  .psec-row:active { background: #F5F7FF; }
  .psec-ic { width: 34px; height: 34px; border-radius: 10px; background: #EEF2FF; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .psec-label { flex: 1; font-size: 13.5px; font-weight: 600; color: #0F172A; }
  .psec-state { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .psec-done { color: #166534; background: #F0FDF4; border: 1px solid #BBF7D0; }
  .psec-todo { color: #7B68EE; background: #EEF2FF; border: 1px solid #E0E7FF; }
  .psec-chev { color: #CBD5E1; font-size: 18px; margin-left: 2px; }
  .edit-pencil { text-transform: none; font-size: 12px; font-weight: 700; color: #7B68EE; background: #EEF2FF; border: 1px solid #E0E7FF; border-radius: 999px; padding: 5px 12px; cursor: pointer; letter-spacing: 0; }
  .edit-pencil:active { transform: scale(0.96); }

  .hero-row { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
  .hero-avatar { width: 56px; height: 56px; border-radius: 16px; background: rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; font-weight: 900; border: 2px solid rgba(255,255,255,0.3); flex-shrink: 0; }
  .hero-name { font-size: 18px; font-weight: 900; color: #fff; letter-spacing: -0.02em; }
  .hero-uni { font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 2px; }
  .hero-career { font-size: 11.5px; color: rgba(255,255,255,0.65); margin-top: 1px; }
  .hero-badge { display: inline-flex; align-items: center; gap: 4px; margin-top: 12px; padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3); font-size: 11px; font-weight: 700; color: #fff; position: relative; z-index: 1; }

  /* Recruiter preview button */
  .recruiter-btn { margin: 14px 20px 0; background: #fff; border-radius: 16px; position: relative; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
  .recruiter-btn:active { transform: scale(0.98); }
  .recruiter-btn:hover { box-shadow: 0 4px 16px rgba(123,104,238,0.15); }
  .swipe-btn.no:hover { background: #FEF2F2; transform: scale(1.08); }
  .swipe-btn.save:hover { background: #FFFBEB; transform: scale(1.08); }
  .swipe-btn.yes:hover { background: #F0FDF4; transform: scale(1.08); }
  .modal-cta:hover { opacity: 0.92; }
  .recruiter-btn-inner { display: flex; align-items: center; gap: 14px; padding: 16px; }
  .recruiter-btn-icon { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg,rgba(123,104,238,0.12),rgba(74,158,255,0.1)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 20px; }
  .recruiter-btn-title { font-size: 14px; font-weight: 800; color: #0F172A; }
  .recruiter-btn-sub { font-size: 12px; color: #64748B; margin-top: 1px; }
  .recruiter-btn-arrow { color: #7B68EE; font-size: 18px; margin-left: auto; }
  .recruiter-btn-border { position: absolute; inset: 0; border-radius: 14px; border: 2px solid transparent; background: linear-gradient(135deg,#7B68EE,#4A9EFF) border-box; -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); -webkit-mask-composite: destination-out; mask-composite: exclude; }

  /* Match rows */
  .match-item { padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #F8FAFC; }
  .match-item:last-child { border-bottom: none; }
  .match-rank { width: 22px; height: 22px; border-radius: 8px; background: linear-gradient(135deg,#7B68EE,#4A9EFF); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: #fff; flex-shrink: 0; }
  .match-role { font-size: 13px; font-weight: 700; color: #0F172A; }
  .match-sector { font-size: 11px; color: #94A3B8; margin-top: 1px; }
  .match-why { font-size: 10.5px; color: #7B68EE; margin-top: 2px; font-weight: 600; }
  .match-nudge { font-size: 12px; color: #64748B; padding: 12px 20px; background: #F5F3FF; line-height: 1.4; }
  .match-nudge strong { color: #4F46E5; }
  .match-pct { font-size: 15px; font-weight: 900; background: linear-gradient(135deg,#7B68EE,#4A9EFF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .match-bar { width: 60px; height: 4px; background: #EEF2FF; border-radius: 999px; overflow: hidden; margin-top: 4px; }
  .match-bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg,#7B68EE,#4A9EFF); }

  /* Info blocks */
  .info-block { padding: 12px 20px; display: flex; gap: 12px; border-bottom: 1px solid #F8FAFC; align-items: flex-start; }
  .info-block:last-child { border-bottom: none; }
  .info-icon { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
  .info-key { font-size: 11px; color: #94A3B8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .info-val { font-size: 13.5px; font-weight: 600; color: #0F172A; margin-top: 1px; }

  /* Pills */
  .pills { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 20px; }
  .pill-tag { padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }

  /* Test / skills */
  .test-banner { margin: 16px 20px 0; padding: 18px; background: linear-gradient(135deg,#1E1B4B,#312E81); border-radius: 18px; display: flex; align-items: center; gap: 14px; }
  .test-banner-icon { font-size: 32px; }
  .test-banner-title { font-size: 14px; font-weight: 800; color: #fff; }
  .test-banner-sub { font-size: 12px; color: rgba(255,255,255,0.65); margin-top: 2px; }
  .test-banner-btn { margin-left: auto; padding: 8px 14px; border-radius: 10px; background: rgba(255,255,255,0.15); color: #fff; font-size: 12px; font-weight: 700; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; flex-shrink: 0; }
  .skill-row { padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #F8FAFC; }
  .skill-row:last-child { border-bottom: none; }
  .skill-emoji { font-size: 18px; width: 32px; text-align: center; }
  .skill-name { flex: 1; font-size: 13px; font-weight: 600; color: #0F172A; }
  .skill-bar-wrap { width: 80px; height: 6px; background: #EEF2FF; border-radius: 999px; overflow: hidden; }
  .skill-bar-fill { height: 100%; background: linear-gradient(90deg,#7B68EE,#4A9EFF); border-radius: 999px; }
  .skill-pct { font-size: 12px; font-weight: 800; color: #7B68EE; width: 32px; text-align: right; }

  /* Inbox */
  .inbox-item { padding: 14px 20px; display: flex; align-items: flex-start; gap: 12px; cursor: pointer; transition: background 0.1s; border-bottom: 1px solid #F8FAFC; }
  .inbox-item:last-child { border-bottom: none; }
  .inbox-item:active { background: #F5F7FF; }
  .inbox-item.unread { background: rgba(123,104,238,0.03); }
  .inbox-avatar { width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; color: #fff; flex-shrink: 0; }
  .inbox-company { font-size: 13.5px; font-weight: 700; color: #0F172A; }
  .inbox-preview { font-size: 12.5px; color: #64748B; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .inbox-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; margin-left: auto; flex-shrink: 0; }
  .inbox-time { font-size: 11px; color: #94A3B8; }
  .inbox-dot { width: 9px; height: 9px; border-radius: 999px; background: #7B68EE; }

  /* Ofertas */
  .swipe-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 16px 20px 0; }
  .swipe-stat { background: #fff; border-radius: 14px; border: 1px solid #E2E8F0; padding: 12px; text-align: center; }
  .swipe-stat-n { font-size: 22px; font-weight: 900; }
  .swipe-stat-l { font-size: 11px; color: #94A3B8; margin-top: 2px; font-weight: 500; }
  .swipe-wrapper { padding: 16px 20px 0; }
  .job-card { background: #fff; border-radius: 20px; border: 1px solid #E2E8F0; box-shadow: 0 4px 24px rgba(0,0,0,0.07); padding: 20px; position: relative; overflow: hidden; }
  .job-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; }
  .job-top { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .job-logo { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: #fff; flex-shrink: 0; }
  .job-company { font-size: 12px; color: #64748B; font-weight: 500; }
  .job-title { font-size: 17px; font-weight: 900; color: #0F172A; letter-spacing: -0.02em; }
  .job-location { font-size: 12px; color: #94A3B8; margin-top: 2px; }
  .job-match-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; background: linear-gradient(135deg,rgba(123,104,238,0.1),rgba(74,158,255,0.08)); border: 1px solid rgba(123,104,238,0.15); margin-bottom: 12px; }
  .job-match-num { font-size: 15px; font-weight: 900; background: linear-gradient(135deg,#7B68EE,#4A9EFF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .job-match-txt { font-size: 12px; color: #64748B; }
  .job-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .job-tag { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 500; background: #F8FAFC; color: #475569; border: 1px solid #E2E8F0; }
  .job-desc { font-size: 13px; color: #64748B; line-height: 1.6; margin-bottom: 18px; }
  .swipe-btns { display: flex; justify-content: center; gap: 20px; }
  .swipe-btn { width: 58px; height: 58px; border-radius: 999px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 22px; border: 2px solid; transition: all 0.2s; background: #fff; }
  .swipe-btn:active { transform: scale(0.92); }
  .swipe-btn.no { border-color: #FECACA; color: #EF4444; }
  .swipe-btn.save { border-color: #FDE68A; color: #F59E0B; }
  .swipe-btn.yes { border-color: #A7F3D0; color: #10B981; }
  .swipe-counter-bar { display: flex; justify-content: center; gap: 5px; margin-top: 12px; }
  .swipe-dot { width: 6px; height: 6px; border-radius: 999px; background: #CBD5E1; }
  .swipe-dot.current { background: #7B68EE; width: 18px; transition: width 0.2s; }
  .swipe-hint { text-align: center; font-size: 12px; color: #94A3B8; margin-top: 8px; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(15,23,42,0.5); backdrop-filter: blur(4px); align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal-sheet { width: 100%; max-width: 430px; background: #F8FAFC; border-radius: 24px 24px 0 0; padding: 0 0 32px; animation: slideUp 0.3s cubic-bezier(0.22,1,0.36,1); max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-handle { width: 36px; height: 4px; border-radius: 999px; background: #E2E8F0; margin: 12px auto; }
  .modal-title { text-align: center; font-size: 15px; font-weight: 800; color: #0F172A; padding: 4px 20px 16px; }
  .modal-head { position: sticky; top: 0; z-index: 6; background: #F8FAFC; border-radius: 24px 24px 0 0; }
  .sheet-close { position: absolute; top: 12px; right: 14px; width: 32px; height: 32px; border-radius: 999px; border: none; background: #EEF2FF; color: #475569; font-size: 15px; font-weight: 700; cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .sheet-close:active { transform: scale(0.92); }
  .recruiter-card { margin: 0 20px; background: #fff; border-radius: 20px; border: 1px solid #E2E8F0; overflow: hidden; box-shadow: 0 8px 32px rgba(123,104,238,0.12); }
  .recruiter-card-top { height: 5px; background: linear-gradient(90deg,#7B68EE,#4A9EFF); }
  .recruiter-card-body { padding: 18px; }
  .rc-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  .rc-avatar-row { display: flex; align-items: center; gap: 10px; }
  .rc-avatar { width: 48px; height: 48px; border-radius: 13px; background: linear-gradient(135deg,#7B68EE,#4A9EFF); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; font-weight: 900; flex-shrink: 0; }
  .rc-name { font-size: 14px; font-weight: 900; color: #0F172A; }
  .rc-uni { font-size: 11px; color: #64748B; font-weight: 600; margin-top: 1px; }
  .rc-career { font-size: 11px; color: #94A3B8; margin-top: 1px; }
  .rc-status { font-size: 10px; font-weight: 800; color: #166534; background: #F0FDF4; padding: 4px 10px; border-radius: 999px; border: 1px solid #BBF7D0; white-space: nowrap; flex-shrink: 0; }
  .rc-founder { font-size: 9px; font-weight: 800; color: #B45309; background: linear-gradient(135deg,rgba(245,158,11,0.12),rgba(217,119,6,0.08)); border: 1px solid rgba(245,158,11,0.25); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .rc-ghost-btn { width: 100%; margin-top: 10px; padding: 9px; border: 1px solid #E0E7FF; background: #fff; color: #4F46E5; font-size: 12.5px; font-weight: 700; border-radius: 10px; cursor: pointer; }
  .rc-ghost-btn:active { transform: scale(0.98); }
  .rc-msg-btn { width: 100%; margin-top: 10px; padding: 11px; border: none; background: linear-gradient(135deg,#7B68EE,#4A9EFF); color: #fff; font-size: 13px; font-weight: 800; border-radius: 10px; cursor: pointer; }
  .rc-msg-btn:active { transform: scale(0.98); }

        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')

      try {
        const { data: { session }, error } = await sb.auth.getSession();
        if (error || !session) {
          window.location.href = 'login-estudiantes.html';
          return;
        }
        document.getElementById('app').style.display = 'block';

    async function dbGetStudent(user) {
      const { data } = await sb.from('students').select('*').eq('user_id', user.id).maybeSingle();
      return data || null;
    }
    async function dbUpsertStudent(user, patch) {
      const row = { ...(state.student||{}), ...patch, user_id:user.id, email:user.email, updated_at:new Date().toISOString() };
      const { data, error } = await sb.from('students').upsert(row, { onConflict:'user_id' }).select().single();
      if (error) throw error;
      state.student = data;
      return data;
    }

      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${user.id}/avatar.${ext}`;
      const { error } = await sb.storage.from('avatars').upload(path, file, { upsert:true });
      if (error) throw error;
      const { data } = sb.storage.from('avatars').getPublicUrl(path);
      return data.publicUrl + '?t=' + Date.now();

    // Match usando carrera + hard skills + semestre + industrias
    function computeMatches(student) {
      const st = student || {};
      const carrera = _norm(st.carrera);
      const skills = (Array.isArray(st.hard_skills) ? st.hard_skills : []).map(_norm);
      const inds = (Array.isArray(st.industrias) ? st.industrias : []).map(_norm);
      const sem = _semNum(st.semestre);

      const scored = ROLE_CATALOG.map(r => {
        const careerHit = !!carrera && r.careers.some(k => carrera.includes(k));
        const careerFit = carrera ? (careerHit ? 1 : 0.15) : 0.4;

        const matchedSkills = r.skills.filter(rs => { const n = _norm(rs); return skills.some(us => us.includes(n) || n.includes(us)); });
        const overlap = matchedSkills.length;
        const skillFit = r.skills.length ? Math.min(1, overlap / Math.min(3, r.skills.length)) : 0;

        const roleInds = (r.industries || []).map(_norm);
        const indHit = roleInds.some(ri => inds.some(ui => ui.includes(ri) || ri.includes(ui)));
        const indFit = inds.length ? (indHit ? 1 : 0.2) : 0.5;

        let semFit = 0.6;
        if (sem != null) semFit = sem >= (r.minSem || 1) ? 1 : Math.max(0.3, sem / (r.minSem || 1));

        const score = 0.40 * careerFit + 0.30 * skillFit + 0.15 * indFit + 0.15 * semFit;
        const pct = Math.max(45, Math.min(99, Math.round(45 + score * 54)));

        const reasons = [];
        if (careerHit) reasons.push('tu carrera');
        if (overlap > 0) reasons.push(matchedSkills.slice(0, 2).join(', '));
        if (indHit) reasons.push('tus industrias');

        return { role: r.role, sector: r.sector, pct, reasons, careerHit, overlap };
      });

      scored.sort((a, b) => (b.pct - a.pct) || (b.careerHit - a.careerHit) || (b.overlap - a.overlap));
      return scored;
    }

      const ctaSub = document.getElementById('rc-cta-sub');
      if (ctaText) ctaText.textContent = rcPct >= 100 ? 'Tu perfil se ve sólido ✨' : `Tu perfil está al ${rcPct}%`;
      if (ctaSub) ctaSub.textContent = rcPct >= 100 ? 'Así te contactarán los reclutadores' : 'Complétalo para mejorar tu visibilidad';
    }

    // ── RENDER: TEST DE HABILIDADES ─────────────────────────
    const SKILLS_CONFIG = [
      { key: 'pensamiento_analitico', label: 'Pensamiento analítico', emoji: '💡' },
      { key: 'comunicacion_efectiva', label: 'Comunicación efectiva', emoji: '🗣️' },
      { key: 'adaptabilidad', label: 'Adaptabilidad', emoji: '🔄' },
      { key: 'resolucion_problemas', label: 'Resolución de problemas', emoji: '🧩' },
      { key: 'trabajo_en_equipo', label: 'Trabajo en equipo', emoji: '🤝' },
      { key: 'orientacion_resultados', label: 'Orientación a resultados', emoji: '🎯' },
    ];

    function renderTest({ testResults }) {
      const hab = testResults?.habilidades || {};
      const hasResults = Object.keys(hab).length > 0;

      const skillsHTML = SKILLS_CONFIG.map(s => {
        const pct = hab[s.key] || 0;
        return `
          <div class="skill-row">
            <span class="skill-emoji">${s.emoji}</span>
            <span class="skill-name">${s.label}</span>
            <div class="skill-bar-wrap"><div class="skill-bar-fill" style="width:${pct}%"></div></div>
            <span class="skill-pct">${pct > 0 ? pct + '%' : '—'}</span>
          </div>
        `;
      }).join('');

      document.getElementById('sec-test').innerHTML = `
        <div class="test-banner">
          <div class="test-banner-icon">🧠</div>
          <div>
            <div class="test-banner-title">Test de Habilidades IA</div>
            <div class="test-banner-sub">${hasResults ? 'Actualiza tus resultados' : 'Aún no has tomado el test'}</div>
          </div>
          <button class="test-banner-btn">${hasResults ? 'Retomar →' : 'Empezar →'}</button>
        </div>

        <div class="section-title">Tus habilidades</div>
        <div class="card" style="margin:0 20px 24px;">
          ${hasResults ? skillsHTML : `
            <div style="padding:32px 20px;text-align:center;">
              <div style="font-size:36px;margin-bottom:12px;">🧪</div>
              <div style="font-size:14px;font-weight:700;color:#0F172A;margin-bottom:6px;">Completa tu test</div>
              <div style="font-size:13px;color:#64748B;">Los resultados mejoran tu match con las empresas.</div>
            </div>
          `}
        </div>
      `;
    }

    // ── RENDER: BANDEJA DE ENTRADA ──────────────────────────
    const COMPANY_COLORS = [
      'linear-gradient(135deg,#EF4444,#F97316)',
      'linear-gradient(135deg,#F59E0B,#EF4444)',
      'linear-gradient(135deg,#7B68EE,#4A9EFF)',
      'linear-gradient(135deg,#10B981,#4A9EFF)',
      'linear-gradient(135deg,#EC4899,#8B5CF6)',
    ];

    function timeAgo(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 60) return `hace ${mins}m`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `hace ${hrs}h`;
      const days = Math.floor(hrs / 24);
      if (days === 1) return 'ayer';
      if (days < 7) return `hace ${days}d`;
      return new Date(dateStr).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
    }

    function renderInbox({ messages }) {
      const unreadCount = messages.filter(m => !m.leido && m.sender_type === 'company').length;

      const badge = document.getElementById('inbox-badge');
      const notifDot = document.getElementById('notif-dot');
      if (unreadCount > 0) {
        badge.textContent = unreadCount;
        badge.style.display = 'flex';
        notifDot.style.display = 'block';
      }

      const itemsHTML = messages.length === 0
        ? `<div style="padding:32px 20px;text-align:center;"><div style="font-size:36px;margin-bottom:12px;">📭</div><div style="font-size:14px;font-weight:700;color:#0F172A;">Sin mensajes aún</div><div style="font-size:13px;color:#64748B;margin-top:6px;">Las empresas te contactarán aquí.</div></div>`
        : messages.map((msg, i) => {
            const isUnread = !msg.leido && msg.sender_type === 'company';
            const initials = (msg.company_id || 'E').toString().slice(0, 2).toUpperCase();
            const preview = escapeHTML(msg.contenido.length > 60 ? msg.contenido.slice(0, 60) + '…' : msg.contenido);
            return `
              <div class="inbox-item ${isUnread ? 'unread' : ''}">
                <div class="inbox-avatar" style="background:${COMPANY_COLORS[i % COMPANY_COLORS.length]}">${initials}</div>
                <div style="flex:1;min-width:0;">
                  <div class="inbox-company">Empresa</div>
                  <div class="inbox-preview">${preview}</div>
                </div>
                <div class="inbox-meta">
                  <span class="inbox-time">${timeAgo(msg.created_at)}</span>
                  ${isUnread ? '<div class="inbox-dot"></div>' : ''}
                </div>
              </div>
            `;
          }).join('');

      document.getElementById('sec-inbox').innerHTML = `
        <div class="section-title" style="padding-top:16px;">Mensajes recientes</div>
        <div class="card" style="margin:0 20px 24px;">${itemsHTML}</div>
      `;
    }

    // ── RENDER: OFERTAS DE EMPLEO ───────────────────────────
    const JOB_OFFERS = [
      { id:1, company:'Nubank', location:'CDMX · Híbrido', salary:'$18,000–22,000/mes', title:'Product Analyst Jr.', logoColor:'linear-gradient(135deg,#6366F1,#8B5CF6)', logoInitial:'N', accentColor:'#6366F1', tags:['SQL','Python','Tableau','Fintech'], desc:'Analizarás datos de comportamiento de usuarios para mejorar productos financieros en un equipo data-driven.', match:91 },
      { id:2, company:'Grupo Bimbo', location:'Cuautitlán · Presencial', salary:'$15,000–18,000/mes', title:'Analista de Marketing Jr.', logoColor:'linear-gradient(135deg,#EF4444,#F97316)', logoInitial:'B', accentColor:'#EF4444', tags:['Excel','Meta Ads','Google Analytics','FMCG'], desc:'Coordinarás campañas digitales para las marcas del portafolio Bimbo en México.', match:85 },
      { id:3, company:'Clip', location:'CDMX · Remoto', salary:'$20,000–25,000/mes', title:'Data Analyst Jr.', logoColor:'linear-gradient(135deg,#10B981,#4A9EFF)', logoInitial:'Cl', accentColor:'#10B981', tags:['SQL','Looker','Python','Pagos'], desc:'Construirás dashboards y reportes de pagos para el equipo de operaciones de Clip.', match:88 },
      { id:4, company:'Deloitte', location:'CDMX · Híbrido', salary:'$16,000–20,000/mes', title:'Analista Consultor Jr.', logoColor:'linear-gradient(135deg,#0EA5E9,#6366F1)', logoInitial:'D', accentColor:'#0EA5E9', tags:['Excel','PowerPoint','Consultoría','Big 4'], desc:'Participarás en proyectos de transformación digital para clientes de distintas industrias.', match:81 },
      { id:5, company:'Rappi', location:'CDMX · Híbrido', salary:'$17,000–21,000/mes', title:'Growth Analyst Jr.', logoColor:'linear-gradient(135deg,#F59E0B,#EF4444)', logoInitial:'R', accentColor:'#F59E0B', tags:['SQL','Growth','A/B Testing','Latam'], desc:'Analizarás métricas de retención y activación para el equipo de crecimiento de Rappi.', match:79 },
    ];

    let currentOffer = 0;
    let appliedCount = 0;
    let savedCount = 0;

    function renderOfertas() {
      document.getElementById('sec-ofertas').innerHTML = `
        <div class="swipe-stats">
          <div class="swipe-stat"><div class="swipe-stat-n" style="color:#10B981;" id="stat-applied">${appliedCount}</div><div class="swipe-stat-l">Aplicadas</div></div>
          <div class="swipe-stat"><div class="swipe-stat-n" style="color:#F59E0B;" id="stat-saved">${savedCount}</div><div class="swipe-stat-l">Guardadas</div></div>
          <div class="swipe-stat"><div class="swipe-stat-n" style="color:#7B68EE;">${JOB_OFFERS.length}</div><div class="swipe-stat-l">Disponibles</div></div>
        </div>
        <div class="swipe-wrapper" id="swipe-wrapper"></div>
      `;
      renderJobCard();
    }

    function renderJobCard() {
      const wrapper = document.getElementById('swipe-wrapper');
      if (currentOffer >= JOB_OFFERS.length) {
        wrapper.innerHTML = `
          <div style="text-align:center;padding:48px 20px;">
            <div style="font-size:48px;margin-bottom:16px;">🎉</div>
            <div style="font-size:16px;font-weight:800;color:#0F172A;margin-bottom:6px;">¡Revisaste todas las ofertas!</div>
            <div style="font-size:13px;color:#64748B;">Vuelve mañana para ver nuevas oportunidades.</div>
          </div>`;
        return;
      }

      const j = JOB_OFFERS[currentOffer];
      const dots = JOB_OFFERS.map((_, i) =>
        `<div class="swipe-dot ${i === currentOffer ? 'current' : ''}"></div>`
      ).join('');

      wrapper.innerHTML = `
        <div class="job-card" style="--accent:${j.accentColor}">
          <style>.job-card::before{background:${j.logoColor};}</style>
          <div class="job-top">
            <div class="job-logo" style="background:${j.logoColor}">${j.logoInitial}</div>
            <div>
              <div class="job-company">${escapeHTML(j.company)} · ${escapeHTML(j.location)}</div>
              <div class="job-title">${escapeHTML(j.title)}</div>
              <div class="job-location">📍 ${escapeHTML(j.salary)}</div>
            </div>
          </div>
          <div class="job-match-pill">
            <span class="job-match-num">${j.match}%</span>
            <span class="job-match-txt">match con tu perfil</span>
          </div>
          <div class="job-tags">${j.tags.map(t => `<span class="job-tag">${escapeHTML(t)}</span>`).join('')}</div>
          <p class="job-desc">${escapeHTML(j.desc)}</p>
          <div class="swipe-btns">
            <button class="swipe-btn no" onclick="swipeAction('no')" title="Descartar">✕</button>
            <button class="swipe-btn save" onclick="swipeAction('save')" title="Guardar">★</button>
            <button class="swipe-btn yes" onclick="swipeAction('yes')" title="Aplicar">✓</button>
          </div>
        </div>
        <div class="swipe-counter-bar">${dots}</div>
        <div class="swipe-hint">${currentOffer + 1} de ${JOB_OFFERS.length} ofertas · Actualizado hoy</div>
      `;
    }

    function swipeAction(action) {
      if (action === 'yes') appliedCount++;
      if (action === 'save') savedCount++;
      currentOffer++;
      renderOfertas();
    }

    init();

    const sectionTitles = { perfil:'Mi Perfil', test:'Test de Habilidades', inbox:'Bandeja de Entrada', ofertas:'Ofertas de Empleo' };

    function showSection(id) {
      if (!document.getElementById('sec-' + id)) return;
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.getElementById('sec-' + id).classList.add('active');
      document.getElementById('tab-' + id).classList.add('active');
      document.getElementById('topbar-greeting').textContent = sectionTitles[id];
      document.querySelector('.scroll-content').scrollTop = 0;
    }

    function toggleFullTest() {
      const p = document.getElementById('rc-full-test');
      const b = document.getElementById('rc-test-toggle');
      if (!p) return;
      const open = p.style.display === 'none';
      p.style.display = open ? 'block' : 'none';
      if (b) b.textContent = open ? 'Ocultar resultados del Test IA' : 'Ver resultados del Test IA →';
    }
    function previewSendMessage() {
      const n = document.getElementById('rc-msg-note');
      if (n) n.style.display = 'block';
    }
    function openModal() { document.getElementById('modal').classList.add('open'); }
    function closeModal() { document.getElementById('modal').classList.remove('open'); }
    function closeModalOutside(e) { if (!e.target.closest('.modal-sheet')) closeModal(); }

    // ── Selector de tema del hero ───────────────────────────
    const HERO_THEMES = [
      { id:'aurora',   name:'Aurora',    desc:'Vibrante, con luces de color', swatch:'background:radial-gradient(circle at 20% 20%,#8B5CF6,transparent 60%),radial-gradient(circle at 80% 80%,#EC4899,transparent 60%),#0C0A28;' },
      { id:'midnight', name:'Midnight',  desc:'Índigo profundo, premium',     swatch:'background:radial-gradient(120% 120% at 80% 0%,#322A78,#120E30);' },
      { id:'monogram', name:'Monograma', desc:'Morado de marca con la “Z”',   swatch:'background:linear-gradient(135deg,#6D5AE6,#4A9EFF);' },
    ];
    function openThemeSheet() {
      const cur = (state.student && state.student.tema) || 'aurora';
      document.getElementById('theme-options').innerHTML = HERO_THEMES.map(t => `
        <div class="theme-row" onclick="setTheme('${t.id}')">
          <div class="theme-swatch" style="${t.swatch}"></div>
          <div style="flex:1;"><div class="theme-name">${t.name}</div><div class="theme-desc">${escapeHTML(t.desc)}</div></div>
          ${cur === t.id ? '<div class="theme-check">✓</div>' : ''}
        </div>`).join('');
      document.getElementById('theme-modal').classList.add('open');
    }
    async function setTheme(id) {
      try { await dbUpsertStudent(state.user, { tema: id }); } catch (e) { console.error('No se pudo guardar el tema:', e); }
      document.getElementById('theme-modal').classList.remove('open');
      renderPerfil(state);
    }
    function closeThemeOutside(e) { if (!e.target.closest('.modal-sheet')) document.getElementById('theme-modal').classList.remove('open'); }

    // ── EDIT SHEET (motor config-driven) ─────────────────────
    let editSectionId = null;
    let editDraft = {};

    function skillChipsHTML() {
      return (editDraft.hard_skills||[]).map((s,i)=>`<span class="skill-chip">${escapeHTML(s)}<button type="button" onclick="removeSkillAt(${i})">✕</button></span>`).join('');
    }

    function fieldHTML(f) {
      const val = editDraft[f.key];
      if (f.type === 'textarea')
        return `<textarea class="field-textarea" data-key="${f.key}" placeholder="${escapeHTML(f.placeholder||'')}">${escapeHTML(val||'')}</textarea>`;
      if (f.type === 'select')
        return `<select class="field-select" data-key="${f.key}"><option value="">Selecciona…</option>${f.options.map(o=>`<option ${val===o?'selected':''}>${o}</option>`).join('')}</select>`;
      if (f.type === 'tags') {
        const sel = Array.isArray(val) ? val : [];
        return `<div data-key="${f.key}" data-type="tags">${f.options.map(o=>`<span class="tag-opt ${sel.includes(o)?'sel':''}" onclick="toggleTag(this)">${o}</span>`).join('')}</div>`;
      }
      if (f.type === 'skills') {
        return `<div data-key="${f.key}" data-type="skills">
          <div id="skill-chips">${skillChipsHTML()}</div>
          <div style="display:flex;gap:8px;margin-top:6px;"><input class="field-input" id="skill-input" placeholder="Ej. SQL, Figma, Python"/><button class="progress-cta" style="color:#4A2FD6;" onclick="addSkill()">Añadir</button></div>
          <div style="font-size:11.5px;color:#94A3B8;margin-top:6px;">Añade al menos 3.</div></div>`;
      }
      if (f.type === 'photo') {
        const src = val || '';
        const preview = src
          ? `<img class="photo-preview" id="photo-preview" src="${escapeHTML(src)}" onclick="triggerFotoInput()" style="cursor:pointer;"/>`
          : `<div class="photo-preview" id="photo-preview" onclick="triggerFotoInput()" style="display:flex;align-items:center;justify-content:center;background:#EEF2FF;color:#7B68EE;font-weight:900;cursor:pointer;">＋</div>`;
        return `<div data-key="${f.key}" data-type="photo">
          <div style="display:flex;align-items:center;gap:12px;">
            ${preview}
            <button type="button" class="progress-cta" style="color:#4A2FD6;" onclick="triggerFotoInput()">Subir foto</button>
            <input id="foto-file-input" type="file" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;" onchange="onPhotoPick(event)"/>
          </div></div>`;
      }
      if (f.type === 'checkbox') {
        return `<label class="chk-row" data-key="${f.key}" data-type="checkbox"><input type="checkbox" ${val ? 'checked' : ''}/><span>${escapeHTML(f.label)}</span></label>`;
      }
      const t = f.type === 'url' ? 'url' : (f.type === 'tel' ? 'tel' : 'text');
      return `<input class="field-input" type="${t}" data-key="${f.key}" value="${escapeHTML(val||'')}" placeholder="${escapeHTML(f.placeholder||'')}"/>`;
    }

    function openEditSheet(sectionId) {
      const sec = PROFILE_SECTIONS.find(s => s.id === sectionId);
      if (!sec) return;
      editSectionId = sectionId;
      editDraft = {};
      sec.fields.forEach(f => { editDraft[f.key] = state.student ? state.student[f.key] : null; });
      document.getElementById('edit-title').textContent = sec.label;
      const habNote = sectionId === 'habilidades'
        ? `<div class="hab-note">🧠 Con 3+ herramientas ya completas esta sección. El <strong>Test IA</strong> es opcional y potencia tu match con las empresas. <span class="hab-link" onclick="goToTest()">Verlo en Test →</span></div>`
        : '';
      document.getElementById('edit-body').innerHTML = habNote + sec.fields.map(f =>
        f.type === 'checkbox'
          ? `<div class="field">${fieldHTML(f)}</div>`
          : `<div class="field"><label class="field-label">${escapeHTML(f.label)}</label>${fieldHTML(f)}</div>`).join('');
      document.getElementById('edit-error').style.display = 'none';
      document.getElementById('edit-modal').classList.add('open');
    }
    function closeEditSheet() { document.getElementById('edit-modal').classList.remove('open'); }
    function goToTest() { closeEditSheet(); showSection('test'); }
    function closeEditOutside(e) { if (!e.target.closest('.modal-sheet')) closeEditSheet(); }

    function toggleTag(el) { el.classList.toggle('sel'); }
    function addSkill() {
      const input = document.getElementById('skill-input');
      const v = input.value.trim();
      if (!v) return;
      const cur = Array.isArray(editDraft.hard_skills) ? editDraft.hard_skills : [];
      if (!cur.includes(v)) cur.push(v);
      editDraft.hard_skills = cur;
      input.value = '';
      rerenderSkills();
    }
    function removeSkillAt(i) {
      (editDraft.hard_skills||[]).splice(i, 1);
      rerenderSkills();
    }
    function rerenderSkills() {
      document.getElementById('skill-chips').innerHTML = skillChipsHTML();
    }
    function triggerFotoInput() {
      const inp = document.getElementById('foto-file-input');
      if (inp) inp.click();
    }

    function toggleEditPanel() {
      const p = document.getElementById('edit-panel');
      if (p) p.style.display = p.style.display === 'none' ? 'block' : 'none';
    }

    async function onPhotoPick(e) {
      const file = e.target.files[0]; if (!file) return;
      const errEl = document.getElementById('edit-error');
      const el = document.getElementById('photo-preview');
      const prevHTML = el ? el.outerHTML : '';
      // Estado "subiendo…"
      if (el) el.outerHTML = `<div class="photo-preview" id="photo-preview" style="display:flex;align-items:center;justify-content:center;background:#EEF2FF;color:#7B68EE;font-size:11px;font-weight:700;">…</div>`;
      try {
        const url = await dbUploadAvatar(state.user, file);
        editDraft.foto_url = url;
        const cur = document.getElementById('photo-preview');
        if (cur) cur.outerHTML = `<img class="photo-preview" id="photo-preview" src="${escapeHTML(url)}" onclick="triggerFotoInput()" style="cursor:pointer;"/>`;
        if (errEl) errEl.style.display = 'none';
      } catch (err) {
        console.error('Avatar upload failed:', err);
        const cur = document.getElementById('photo-preview');
        if (cur) cur.outerHTML = prevHTML;
        if (errEl) {
          errEl.textContent = 'No se pudo subir la foto (' + (err && err.message ? err.message : 'error') + '). Puedes guardar sin foto y subirla después.';
          errEl.style.display = 'block';
        }
      }
    }

    function collectDraft() {
      document.querySelectorAll('#edit-body [data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        const type = el.getAttribute('data-type');
        if (type === 'tags') editDraft[key] = [...el.querySelectorAll('.tag-opt.sel')].map(t => t.textContent);
        else if (type === 'skills' || type === 'photo') { /* ya en editDraft */ }
        else if (type === 'checkbox') editDraft[key] = el.querySelector('input').checked;
        else if (el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') editDraft[key] = el.value.trim();
      });
    }
    function validateDraft(sec) {
      if (sec.id === 'links' && editDraft.links_later) return null;
      for (const f of sec.fields) {
        if (!f.required) continue;
        if (f.type === 'skills' && (!(editDraft[f.key]||[]).length || editDraft[f.key].length < 3)) return 'Añade al menos 3 habilidades.';
        if (f.type === 'tags' && !(editDraft[f.key]||[]).length) return 'Selecciona al menos una opción.';
        if (!editDraft[f.key] || !String(editDraft[f.key]).trim()) return `Completa: ${f.label}.`;
        if (f.type === 'url' && !/^https?:\/\//.test(editDraft[f.key])) return 'Los links deben empezar con http(s)://';
        if (f.type === 'tel' && String(editDraft[f.key]).replace(/\D/g,'').length < 10) return 'Ingresa un teléfono válido (al menos 10 dígitos).';
      }
      return null;
    }
    async function saveEditSheet() {
      const sec = PROFILE_SECTIONS.find(s => s.id === editSectionId);
      collectDraft();
      const err = validateDraft(sec);
      const errEl = document.getElementById('edit-error');
      if (err) { errEl.textContent = err; errEl.style.display = 'block'; return; }
      const patch = {};
      sec.fields.forEach(f => { patch[f.key] = editDraft[f.key]; });
      await dbUpsertStudent(state.user, patch);
      await maybeUnlockRecruiting();
      closeEditSheet();
      renderPerfil(state);
    }
    async function maybeUnlockRecruiting() {
      const { pct } = computeProgress(state.student, state.testResults);
      const target = pct >= 100 ? 'en_busqueda' : 'incompleto';
      if (state.student.estado !== target) {
        await dbUpsertStudent(state.user, { estado: target });
      }
    }
  </script>
</body>
</html>
