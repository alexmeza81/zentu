<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZentU — Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"
    integrity="sha384-2zrRDgDHSYB/GN3nFW3fsZXoxEhKIr3N2h63Tc6DEOB9JJdFIu8xMJT2Cph/gBil"
    crossorigin="anonymous"></script>
  <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #F0F2FF; min-height: 100vh; }

  .app-shell { max-width: 430px; margin: 0 auto; min-height: 100vh; background: #F0F2FF; position: relative; display: flex; flex-direction: column; }
  /* En navegador (desktop) la app se ve enmarcada sobre un fondo de marca, no como columna angosta */
  @media (min-width: 560px) {
    body { background:
      radial-gradient(circle at 12% 18%, rgba(123,104,238,0.30), transparent 30%),
      radial-gradient(circle at 88% 26%, rgba(74,158,255,0.28), transparent 32%),
      radial-gradient(circle at 24% 88%, rgba(236,72,153,0.16), transparent 30%),
      radial-gradient(circle at 80% 84%, rgba(45,212,191,0.16), transparent 30%),
      #EAECF5; }
    .app-shell { box-shadow: 0 20px 72px rgba(30,27,75,0.24); }
  }

  /* Top bar */
  .topbar { position: sticky; top: 0; z-index: 20; background: rgba(240,242,255,0.92); backdrop-filter: blur(12px); padding: 14px 20px 10px; display: flex; align-items: center; justify-content: space-between; }
  .topbar-logo { display: flex; align-items: center; gap: 8px; }
  .logo-icon { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg,#7B68EE,#4A9EFF); display: flex; align-items: center; justify-content: center; }
  .topbar-greeting { font-size: 16px; font-weight: 800; color: #0F172A; letter-spacing: -0.02em; }
  .topbar-bell { width: 36px; height: 36px; border-radius: 12px; background: #fff; border: 1px solid #E2E8F0; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
  .notif-dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 999px; background: #EF4444; border: 2px solid #F0F2FF; }

  /* Scroll */
  .scroll-content { flex: 1; overflow-y: auto; padding: 0 0 90px; }

  /* Sections */
  .section { display: none; }
  .section.active { display: block; }

  /* Bottom nav */
  .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); border-top: 1px solid rgba(0,0,0,0.06); display: flex; z-index: 30; padding: 8px 0 max(8px, env(safe-area-inset-bottom)); }
  .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; cursor: pointer; transition: all 0.2s; }
  .nav-tab .tab-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 8px; transition: all 0.2s; }
  .nav-tab .tab-label { font-size: 10px; font-weight: 600; color: #94A3B8; transition: color 0.2s; }
  .nav-tab.active .tab-icon { background: linear-gradient(135deg,#7B68EE,#4A9EFF); }
  .nav-tab.active .tab-icon svg { color: #fff !important; }
  .nav-tab:not(.active) .tab-icon svg { color: #94A3B8; }
  .nav-tab.active .tab-label { color: #7B68EE; font-weight: 700; }
  .nav-badge-wrap { position: relative; }
  .nav-badge-wrap .badge { position: absolute; top: -4px; right: -6px; min-width: 16px; height: 16px; border-radius: 999px; background: #EF4444; color: #fff; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 3px; }

  /* Cards */
  .card { background: #fff; border-radius: 18px; border: 1px solid rgba(0,0,0,0.05); overflow: hidden; }
  .section-title { font-size: 13px; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 0.06em; padding: 20px 20px 8px; }
  .section-desc { font-size: 12.5px; color: #94A3B8; line-height: 1.5; padding: 0 20px 10px; }
  .section-desc strong { color: #7B68EE; font-weight: 700; }

  /* Profile hero */
  .profile-hero { margin: 16px 20px 0; border-radius: 20px; padding: 20px; position: relative; overflow: hidden; isolation: isolate; background: linear-gradient(135deg,#7B68EE 0%,#4A9EFF 100%); }
  .hero-theme-btn { position: absolute; top: 12px; right: 12px; z-index: 4; width: 32px; height: 32px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.28); background: rgba(255,255,255,0.16); backdrop-filter: blur(6px); color: #fff; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .hero-theme-btn:active { transform: scale(0.94); }
  /* Temas del hero */
  .profile-hero.t-aurora { background: #0C0A28; }
  .profile-hero.t-aurora::before { content: ''; position: absolute; inset: -25%; z-index: 0; filter: blur(14px); background: radial-gradient(circle at 12% 18%, rgba(139,92,246,0.95), transparent 42%), radial-gradient(circle at 88% 12%, rgba(59,130,246,0.85), transparent 42%), radial-gradient(circle at 78% 92%, rgba(236,72,153,0.7), transparent 42%), radial-gradient(circle at 15% 95%, rgba(45,212,191,0.6), transparent 42%); }
  .profile-hero.t-midnight { background: radial-gradient(130% 120% at 82% -10%, #322A78 0%, #1A153F 52%, #120E30 100%); border: 1px solid rgba(255,255,255,0.09); }
  .profile-hero.t-monogram { background: linear-gradient(135deg,#6D5AE6,#4A9EFF); }
  .profile-hero.t-monogram::before { content: ''; position: absolute; inset: 0; z-index: 0; opacity: 0.14; background-image: radial-gradient(circle,#fff 1.1px,transparent 1.4px); background-size: 15px 15px; }
  .profile-hero.t-monogram::after { content: 'Z'; position: absolute; right: -8px; bottom: -40px; z-index: 0; font-weight: 900; font-size: 170px; color: rgba(255,255,255,0.10); line-height: 1; }
  /* Selector de tema */
  .theme-row { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid #E2E8F0; border-radius: 14px; margin-bottom: 10px; cursor: pointer; background: #fff; }
  .theme-row:active { background: #F5F7FF; }
  .theme-swatch { width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.06); }
  .theme-name { font-size: 14px; font-weight: 800; color: #0F172A; }
  .theme-desc { font-size: 12px; color: #64748B; margin-top: 1px; }
  .theme-check { color: #7B68EE; font-weight: 900; font-size: 18px; }

  /* Onboarding progress card */
  .progress-card { margin: 16px 20px 0; background: linear-gradient(135deg,#7B68EE,#4A9EFF); border-radius: 20px; padding: 18px 20px; color: #fff; }
  .progress-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .progress-title { font-size: 14px; font-weight: 800; }
  .progress-pct { font-size: 22px; font-weight: 900; }
  .progress-track { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.25); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 999px; background: #fff; transition: width 0.4s cubic-bezier(0.22,1,0.36,1); }
  .progress-copy { font-size: 12.5px; color: rgba(255,255,255,0.9); margin-top: 12px; line-height: 1.5; }
  .progress-cta { margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; background: #fff; color: #4A2FD6; font-size: 13px; font-weight: 800; cursor: pointer; border: none; }
  .progress-cta:active { transform: scale(0.97); }
  .progress-done { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; font-weight: 800; }
  /* Secciones checklist */
  .psec-row { display: flex; align-items: center; gap: 12px; padding: 13px 20px; border-bottom: 1px solid #F8FAFC; cursor: pointer; transition: background 0.1s; }
  .psec-row:last-child { border-bottom: none; }
  .psec-row:active { background: #F5F7FF; }
  .psec-ic { width: 34px; height: 34px; border-radius: 10px; background: #EEF2FF; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .psec-label { flex: 1; font-size: 13.5px; font-weight: 600; color: #0F172A; }
  .psec-state { font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .psec-done { color: #166534; background: #F0FDF4; border: 1px solid #BBF7D0; }
  .psec-todo { color: #7B68EE; background: #EEF2FF; border: 1px solid #E0E7FF; }
  .psec-chev { color: #CBD5E1; font-size: 18px; margin-left: 2px; }
  .edit-pencil { text-transform: none; font-size: 12px; font-weight: 700; color: #7B68EE; background: #EEF2FF; border: 1px solid #E0E7FF; border-radius: 999px; padding: 5px 12px; cursor: pointer; letter-spacing: 0; }
  .edit-pencil:active { transform: scale(0.96); }

  .hero-row { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
  .hero-avatar { width: 56px; height: 56px; border-radius: 16px; background: rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; font-weight: 900; border: 2px solid rgba(255,255,255,0.3); flex-shrink: 0; }
  .hero-name { font-size: 18px; font-weight: 900; color: #fff; letter-spacing: -0.02em; }
  .hero-uni { font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 2px; }
  .hero-career { font-size: 11.5px; color: rgba(255,255,255,0.65); margin-top: 1px; }
  .hero-badge { display: inline-flex; align-items: center; gap: 4px; margin-top: 12px; padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3); font-size: 11px; font-weight: 700; color: #fff; position: relative; z-index: 1; }

  /* Recruiter preview button */
  .recruiter-btn { margin: 14px 20px 0; background: #fff; border-radius: 16px; position: relative; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
  .recruiter-btn:active { transform: scale(0.98); }
  .recruiter-btn:hover { box-shadow: 0 4px 16px rgba(123,104,238,0.15); }
  .swipe-btn.no:hover { background: #FEF2F2; transform: scale(1.08); }
  .swipe-btn.save:hover { background: #FFFBEB; transform: scale(1.08); }
  .swipe-btn.yes:hover { background: #F0FDF4; transform: scale(1.08); }
  .modal-cta:hover { opacity: 0.92; }
  .recruiter-btn-inner { display: flex; align-items: center; gap: 14px; padding: 16px; }
  .recruiter-btn-icon { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg,rgba(123,104,238,0.12),rgba(74,158,255,0.1)); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 20px; }
  .recruiter-btn-title { font-size: 14px; font-weight: 800; color: #0F172A; }
  .recruiter-btn-sub { font-size: 12px; color: #64748B; margin-top: 1px; }
  .recruiter-btn-arrow { color: #7B68EE; font-size: 18px; margin-left: auto; }
  .recruiter-btn-border { position: absolute; inset: 0; border-radius: 14px; border: 2px solid transparent; background: linear-gradient(135deg,#7B68EE,#4A9EFF) border-box; -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); -webkit-mask-composite: destination-out; mask-composite: exclude; }

  /* Match rows */
  .match-item { padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #F8FAFC; }
  .match-item:last-child { border-bottom: none; }
  .match-rank { width: 22px; height: 22px; border-radius: 8px; background: linear-gradient(135deg,#7B68EE,#4A9EFF); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: #fff; flex-shrink: 0; }
  .match-role { font-size: 13px; font-weight: 700; color: #0F172A; }
  .match-sector { font-size: 11px; color: #94A3B8; margin-top: 1px; }
  .match-why { font-size: 10.5px; color: #7B68EE; margin-top: 2px; font-weight: 600; }
  .match-nudge { font-size: 12px; color: #64748B; padding: 12px 20px; background: #F5F3FF; line-height: 1.4; }
  .match-nudge strong { color: #4F46E5; }
  .match-pct { font-size: 15px; font-weight: 900; background: linear-gradient(135deg,#7B68EE,#4A9EFF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .match-bar { width: 60px; height: 4px; background: #EEF2FF; border-radius: 999px; overflow: hidden; margin-top: 4px; }
  .match-bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg,#7B68EE,#4A9EFF); }

  /* Info blocks */
  .info-block { padding: 12px 20px; display: flex; gap: 12px; border-bottom: 1px solid #F8FAFC; align-items: flex-start; }
  .info-block:last-child { border-bottom: none; }
  .info-icon { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
  .info-key { font-size: 11px; color: #94A3B8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .info-val { font-size: 13.5px; font-weight: 600; color: #0F172A; margin-top: 1px; }

  /* Pills */
  .pills { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 20px; }
  .pill-tag { padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }

  /* Test / skills */
  .test-banner { margin: 16px 20px 0; padding: 18px; background: linear-gradient(135deg,#1E1B4B,#312E81); border-radius: 18px; display: flex; align-items: center; gap: 14px; }
  .test-banner-icon { font-size: 32px; }
  .test-banner-title { font-size: 14px; font-weight: 800; color: #fff; }
  .test-banner-sub { font-size: 12px; color: rgba(255,255,255,0.65); margin-top: 2px; }
  .test-banner-btn { margin-left: auto; padding: 8px 14px; border-radius: 10px; background: rgba(255,255,255,0.15); color: #fff; font-size: 12px; font-weight: 700; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; flex-shrink: 0; }
  .test-quiz { padding: 16px 20px 28px; }
  .test-q-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .test-q-back { width: 34px; height: 34px; border-radius: 10px; border: 1px solid #E2E8F0; background: #fff; color: #475569; font-size: 18px; cursor: pointer; flex-shrink: 0; }
  .test-q-count { font-size: 12px; font-weight: 700; color: #94A3B8; }
  .test-q-track { height: 6px; border-radius: 999px; background: #EEF2FF; overflow: hidden; margin-bottom: 20px; }
  .test-q-fill { height: 100%; background: linear-gradient(90deg,#7B68EE,#4A9EFF); border-radius: 999px; transition: width 0.3s; }
  .test-q-text { font-size: 16px; font-weight: 800; color: #0F172A; line-height: 1.4; margin-bottom: 16px; }
  .test-q-opts { display: flex; flex-direction: column; gap: 10px; }
  .test-opt { text-align: left; padding: 14px 16px; border: 1px solid #E2E8F0; background: #fff; border-radius: 14px; font-size: 13.5px; color: #334155; font-weight: 600; cursor: pointer; font-family: inherit; line-height: 1.4; transition: all 0.15s; }
  .test-opt:hover { border-color: #7B68EE; background: #F5F7FF; }
  .test-opt:active { transform: scale(0.99); }
  .test-opt.sel { border-color: #7B68EE; background: #F5F7FF; box-shadow: 0 0 0 2px rgba(123,104,238,0.15); }
  .scale-row { display: flex; gap: 10px; }
  .scale-btn { flex: 1; aspect-ratio: 1; border: 1px solid #E2E8F0; background: #fff; border-radius: 14px; font-size: 18px; font-weight: 900; color: #64748B; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .scale-btn:hover { border-color: #7B68EE; color: #6D5AE6; }
  .scale-btn.sel { background: linear-gradient(135deg,#7B68EE,#4A9EFF); border-color: transparent; color: #fff; }
  .scale-legend { display: flex; justify-content: space-between; font-size: 11px; color: #94A3B8; margin-top: 8px; font-weight: 600; }
  .test-spinner { width: 44px; height: 44px; border: 4px solid #EEF2FF; border-top-color: #7B68EE; border-radius: 999px; margin: 0 auto; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .result-hero { margin: 16px 20px 8px; padding: 22px 20px; border-radius: 20px; background: linear-gradient(135deg,#7B68EE,#4A9EFF); color: #fff; text-align: center; }
  .result-arq { font-size: 20px; font-weight: 900; line-height: 1.25; }
  .result-badge { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 800; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 999px; }
  .result-tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
  .result-tags .chip { font-size: 11px; font-weight: 700; background: rgba(255,255,255,0.18); color: #fff; padding: 4px 10px; border-radius: 999px; }
  .fb-message { font-size: 14px; color: #334155; line-height: 1.65; white-space: pre-line; }
  .fb-card { background: #fff; border: 1px solid #E2E8F0; border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
  .fb-title { font-size: 13px; font-weight: 800; margin-bottom: 5px; }
  .fb-body { font-size: 13px; color: #475569; line-height: 1.55; }
  .skill-row { padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #F8FAFC; }
  .skill-row:last-child { border-bottom: none; }
  .skill-emoji { font-size: 18px; width: 32px; text-align: center; }
  .skill-name { flex: 1; font-size: 13px; font-weight: 600; color: #0F172A; }
  .skill-bar-wrap { width: 80px; height: 6px; background: #EEF2FF; border-radius: 999px; overflow: hidden; }
  .skill-bar-fill { height: 100%; background: linear-gradient(90deg,#7B68EE,#4A9EFF); border-radius: 999px; }
  .skill-pct { font-size: 12px; font-weight: 800; color: #7B68EE; width: 32px; text-align: right; }

  /* Inbox */
  .inbox-item { padding: 14px 20px; display: flex; align-items: flex-start; gap: 12px; cursor: pointer; transition: background 0.1s; border-bottom: 1px solid #F8FAFC; }
  .inbox-item:last-child { border-bottom: none; }
  .inbox-item:active { background: #F5F7FF; }
  .inbox-item.unread { background: rgba(123,104,238,0.03); }
  .inbox-avatar { width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 900; color: #fff; flex-shrink: 0; }
  .inbox-company { font-size: 13.5px; font-weight: 700; color: #0F172A; }
  .inbox-preview { font-size: 12.5px; color: #64748B; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .inbox-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; margin-left: auto; flex-shrink: 0; }
  .inbox-time { font-size: 11px; color: #94A3B8; }
  .inbox-dot { width: 9px; height: 9px; border-radius: 999px; background: #7B68EE; }
  .inbox-hint { font-size: 12.5px; color: #64748B; padding: 0 20px 12px; line-height: 1.5; }
  .inbox-badge-count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #7B68EE; color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

  /* Chat (hilo de conversación) */
  #chat-overlay { position: absolute; inset: 0; z-index: 40; background: #F0F2FF; display: none; flex-direction: column; }
  #chat-overlay.open { display: flex; }
  .chat-head { flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: max(12px, env(safe-area-inset-top)) 14px 12px; background: rgba(255,255,255,0.96); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.06); }
  .chat-back { border: none; background: transparent; padding: 4px; cursor: pointer; display: flex; border-radius: 10px; }
  .chat-back:active { background: #EEF0FF; }
  .chat-avatar { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; color: #fff; flex-shrink: 0; }
  .chat-title { font-size: 14.5px; font-weight: 800; color: #0F172A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-sub { font-size: 12px; color: #64748B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-body { flex: 1; overflow-y: auto; padding: 18px 16px; display: flex; flex-direction: column; }
  .chat-intro { text-align: center; font-size: 12px; color: #94A3B8; margin: 0 auto 18px; max-width: 260px; line-height: 1.5; }
  .bubble-row { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 6px; }
  .bubble-row.mine { align-items: flex-end; }
  .bubble { max-width: 78%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.45; word-wrap: break-word; overflow-wrap: anywhere; white-space: pre-wrap; }
  .bubble-them { background: #fff; color: #0F172A; border-bottom-left-radius: 6px; box-shadow: 0 1px 2px rgba(30,27,75,0.06); }
  .bubble-mine { background: linear-gradient(135deg,#7B68EE,#4A9EFF); color: #fff; border-bottom-right-radius: 6px; }
  .bubble-time { font-size: 10.5px; color: #94A3B8; margin: 3px 4px 4px; }

  <script>
    const SUPABASE_URL = 'https://jlivxulenqbgsybqodiv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsaXZ4dWxlbnFiZ3N5YnFvZGl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgwMjQ5ODEsImV4cCI6MjA4MzYwMDk4MX0.qG4Tx7yB9185vypoZa91y3PPCdphwqXRz8WQKsKBH5g';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Sanitize all user-supplied strings before innerHTML insertion
    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function init() {
      try {
        const { data: { session }, error } = await sb.auth.getSession();
        if (error || !session) {
          window.location.href = 'acceso.html';
          return;
        }
        document.getElementById('app').style.display = 'block';
        await loadDashboard(session.user);
      } catch (err) {
        console.error('Auth init failed:', err);
        window.location.href = 'acceso.html';
      }
    }

    const state = { user:null, waitlist:null, student:null, testResults:null, messages:[], companies:{}, activeThread:null, offers:[], offersIdx:0, appliedCount:0, savedCount:0 };

    async function dbGetStudent(user) {
      const { data } = await sb.from('students').select('*').eq('user_id', user.id).maybeSingle();
      return data || null;
    }
    async function dbUpsertStudent(user, patch) {
      const row = { ...(state.student||{}), ...patch, user_id:user.id, email:user.email, updated_at:new Date().toISOString() };
      const { data, error } = await sb.from('students').upsert(row, { onConflict:'user_id' }).select().single();
      if (error) throw error;
      state.student = data;
      return data;
    }
    async function dbUploadAvatar(user, file) {
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const path = `${user.id}/avatar.${ext}`;
      const { error } = await sb.storage.from('avatars').upload(path, file, { upsert:true });
      if (error) throw error;
      const { data } = sb.storage.from('avatars').getPublicUrl(path);
      return data.publicUrl + '?t=' + Date.now();
    }

    async function dbSaveTest(habilidades) {
      if (!state.student) return;
      const { error } = await sb.from('test_results').insert({ student_id: state.student.id, habilidades });
      if (error) throw error;
    }

    async function dbLoadOffers() {
      state.offers = []; state.offersIdx = 0; state.appliedCount = 0; state.savedCount = 0;
      if (!state.student) return;
      const { data: apps } = await sb.from('job_applications').select('offer_id, estado').eq('student_id', state.student.id);
      const acted = new Set();
      (apps || []).forEach(a => { acted.add(a.offer_id); if (a.estado === 'aplicada') state.appliedCount++; else if (a.estado === 'guardada') state.savedCount++; });
      const { data: offs } = await sb.from('job_offers')
        .select('id, empresa_nombre, titulo, area, ubicacion, modalidad, salario, descripcion, tags')
        .eq('estado', 'publicada').order('created_at', { ascending: false });
      state.offers = (offs || []).filter(o => !acted.has(o.id));
    }
    async function dbApplyOffer(offerId, estado) {
      if (!state.student) return;
      const { error } = await sb.from('job_applications').insert({ offer_id: offerId, student_id: state.student.id, estado });
      if (error && error.code !== '23505') throw error; // 23505 = ya registrado
    }

    async function dbLoadCompanies(ids) {
      const uniq = [...new Set(ids)].filter(Boolean);
      if (!uniq.length) return {};
      const { data } = await sb.from('companies')
        .select('id, nombre_empresa, nombre_contacto, apellido_contacto, cargo, email_corporativo')
        .in('id', uniq);
      const map = {};
      (data || []).forEach(c => { map[c.id] = c; });
      return map;
    }
    async function dbSendMessage(companyId, contenido) {
      const { data, error } = await sb.from('messages')
        .insert({ student_id: state.student.id, company_id: companyId, contenido, sender_type: 'student', leido: true })
        .select('id, created_at').single();
      if (error) throw error;
      return data;
    }
    async function dbMarkThreadRead(companyId) {
      await sb.from('messages').update({ leido: true })
        .eq('student_id', state.student.id).eq('company_id', companyId)
        .eq('sender_type', 'company').eq('leido', false);
    }

    async function loadDashboard(user) {
      state.user = user;
      const { data: waitlist } = await sb.from('waitlist_estudiantes')
        .select('nombre, apellido, email, universidad, carrera, egreso_mes, egreso_year, preferencias, telefono')
        .eq('email', user.email).maybeSingle();
      state.waitlist = waitlist;

      let student = await dbGetStudent(user);
      if (!student) {
        // Crear fila y precargar desde waitlist
        const w = waitlist || {};
        student = await dbUpsertStudent(user, {
          nombre:w.nombre||null, apellido:w.apellido||null,
          universidad:w.universidad||null, carrera:w.carrera||null,
          egreso_mes:w.egreso_mes||null, egreso_year:w.egreso_year||null, telefono:w.telefono||null,
        });
      }
      state.student = student;

      const { data: tr } = await sb.from('test_results').select('habilidades, clasificacion, arquetipo')
        .eq('student_id', student.id).order('completado_at', { ascending:false }).limit(1).maybeSingle();
      state.testResults = tr;

      const { data: msgs } = await sb.from('messages')

    function isFieldFilled(field, student, testResults) {

    function isSectionComplete(sectionId, student, testResults) {
      const sec = PROFILE_SECTIONS.find(s => s.id === sectionId);

      if (sectionId === 'links' && student && student.links_later) return true;
      // Se completa con los campos requeridos. El Test IA es un bonus opcional (mejora el match), no bloquea el 100%.
      return sec.fields.filter(f => f.required).every(f => isFieldFilled(f, student, testResults));

      const pct = Math.round((done / PROFILE_SECTIONS.length) * 100);

      return { pct, sections, nextIncomplete };

    // Match usando carrera + hard skills + semestre + industrias
    function computeMatches(student) {
      const st = student || {};
      const carrera = _norm(st.carrera);
      const skills = (Array.isArray(st.hard_skills) ? st.hard_skills : []).map(_norm);
      const inds = (Array.isArray(st.industrias) ? st.industrias : []).map(_norm);
      const sem = _semNum(st.semestre);

      const scored = ROLE_CATALOG.map(r => {
        const careerHit = !!carrera && r.careers.some(k => carrera.includes(k));
        const careerFit = carrera ? (careerHit ? 1 : 0.15) : 0.4;

        const matchedSkills = r.skills.filter(rs => { const n = _norm(rs); return skills.some(us => us.includes(n) || n.includes(us)); });
        const overlap = matchedSkills.length;
        const skillFit = r.skills.length ? Math.min(1, overlap / Math.min(3, r.skills.length)) : 0;

        const roleInds = (r.industries || []).map(_norm);
        const indHit = roleInds.some(ri => inds.some(ui => ui.includes(ri) || ri.includes(ui)));
        const indFit = inds.length ? (indHit ? 1 : 0.2) : 0.5;

        let semFit = 0.6;
        if (sem != null) semFit = sem >= (r.minSem || 1) ? 1 : Math.max(0.3, sem / (r.minSem || 1));

        const score = 0.40 * careerFit + 0.30 * skillFit + 0.15 * indFit + 0.15 * semFit;
        const pct = Math.max(45, Math.min(99, Math.round(45 + score * 54)));

        const reasons = [];
        if (careerHit) reasons.push('tu carrera');
        if (overlap > 0) reasons.push(matchedSkills.slice(0, 2).join(', '));
        if (indHit) reasons.push('tus industrias');

        return { role: r.role, sector: r.sector, pct, reasons, careerHit, overlap };
      });

      scored.sort((a, b) => (b.pct - a.pct) || (b.careerHit - a.careerHit) || (b.overlap - a.overlap));
      return scored;
    }

    // ── RENDER: TEST DE HABILIDADES ─────────────────────────
    const SKILLS_CONFIG = [

    // ── TEST DE TALENTO (8 preguntas → clasificación IA vía DeepSeek) ──
    // ── TEST DE TALENTO v4 · elección forzada (envía índices canónicos a evaluar-competencias) ──
    const AXES = [
      { key:'pensamiento_critico', label:'Pensamiento crítico', short:'P. crítico' },

    const AX_LABEL = Object.fromEntries(AXES.map(a => [a.key, a.label]));
    // Solo TEXTOS en orden canónico (el mapeo opción→eje vive en el servidor).
    const FC_ITEMS = [
      { code:'I1', q:'Empiezas en un nuevo equipo. ¿Qué es lo más tú en tu primera semana?', opts:['Observo cómo trabajan y me adapto a su ritmo y herramientas','Me presento, pregunto y construyo relación con cada quien','Me ofrezco a ayudar en lo que el equipo necesite','Organizo mis tareas y pendientes para arrancar ordenado'] },

      { code:'I4', q:'Aparece un problema inesperado a media semana. ¿Qué te define?', opts:['Mantengo la calma y sigo aunque se complique','Me reorganizo y cambio el plan rápido','Analizo la causa antes de actuar','Busco quién me puede apoyar'] },
      { code:'I5', q:'Tu forma natural de aprender algo nuevo es…', opts:['Buscar tutoriales/herramientas y probar por mi cuenta','Preguntar a alguien con experiencia','Lanzarme y aprender sobre la marcha','Planear qué necesito aprender y en qué orden'] },
      { code:'I6', q:'Cuando el equipo está bajo presión, tú aportas…', opts:['Calma y aguante para no rendirse','Dirección: alguien tiene que decidir','Unión: que nadie se quede solo','Cabeza fría para priorizar lo importante'] },
      { code:'I7', q:'Te sientes más orgulloso/a de ti cuando…', opts:['Resolví algo complicado con lógica','Cumplí todo lo que me comprometí','Ayudé a que el equipo lograra la meta','Me sobrepuse a algo difícil'] },
      { code:'I8', q:'Un amigo te describiría como el/la que…', opts:['Siempre encuentra la forma de adaptarse','Dice las cosas de frente pero con tacto','Toma la batuta cuando hace falta','Le saca provecho a la tecnología'] },
      { code:'CTRL-ATT', noShuffle:true, q:'Para confirmar que vas con atención, elige la tercera opción.', opts:['Primera opción','Segunda opción','Tercera opción','Cuarta opción'] },
      { code:'I9', q:'Ante una tarea aburrida pero necesaria, tú…', opts:['La hago igual, la disciplina ante todo','Busco una forma más eficiente o de automatizarla','La aguanto sin quejarme hasta terminar','La adapto para hacerla más llevadera'] },
      { code:'I10', q:'Lo que más disfrutas de trabajar en equipo es…', opts:['Debatir ideas para llegar a la mejor','Coordinar y que todo fluya','Convivir y crear buen ambiente','Explicar y alinear a todos'] },
      { code:'I11', q:'Si algo te sale mal, lo primero que haces es…', opts:['Respirar y no desanimarme','Ajustar y probar de otra forma','Buscar la herramienta o el dato que me ayude a resolver','Pedir retroalimentación para mejorar'] },
      { code:'I12', q:'Tu manera de destacar en un trabajo es…', opts:['Entregando siempre a tiempo y completo','Aportando ideas y tomando iniciativa','Usando herramientas que suman valor','Colaborando y sumando al equipo'] },
      { code:'I13', q:'Cuando hay que tomar una decisión difícil, tú…', opts:['Analizas datos y consecuencias','Decides y asumes la responsabilidad','Escuchas al equipo antes de decidir','Te adaptas según cómo evolucione'] },
      { code:'I14', q:'Lo que te hace seguir cuando algo se pone cuesta arriba es…', opts:['Mi resistencia, no me rindo fácil','Recordar mi meta y organizarme','Confiar en que puedo aprender lo que falte','Apoyarme en los demás'] },
      { code:'I15', q:'En una presentación importante, tu fuerte es…', opts:['Explicar claro y conectar con la gente','Tener los datos y el análisis sólidos','Apoyarte en buenas visuales/herramientas','Mantener la calma aunque salga algo mal'] },
      { code:'I16', q:'La gente suele acudir a ti para…', opts:['Que organices y pongas orden','Que tomes el liderazgo','Que no te rindas y saques las cosas adelante','Que ayudes con una herramienta o un dato'] },
      { code:'CTRL-CONS', q:'Ante una decisión importante y difícil, ¿qué se parece más a ti?', opts:['Reviso la información y las consecuencias con lógica','Tomo la decisión y me hago responsable','Consulto al equipo antes de decidir','Voy ajustando según cómo se desarrolle'] },

    let testState = { active:false, loading:false, idx:0, answers:{}, timings:{}, order:{}, shownAt:0 };
    function startTest(){ testState = { active:true, loading:false, idx:0, answers:{}, timings:{}, order:{}, shownAt:Date.now() }; renderTest(state); }
    function cancelTest(){ testState.active=false; renderTest(state); }
    function testBack(){ if(testState.idx>0){ testState.idx--; testState.shownAt=Date.now(); renderTest(state); } else cancelTest(); }
    function fcOrder(i){
      if(testState.order[i]) return testState.order[i];
      const it=FC_ITEMS[i]; let idx=it.opts.map((_,k)=>k);
      if(!it.noShuffle){ for(let k=idx.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [idx[k],idx[j]]=[idx[j],idx[k]]; } }
      testState.order[i]=idx; return idx;
    }
    function pickOpt(i, canon){
      const code=FC_ITEMS[i].code;
      testState.answers[code]=canon;
      testState.timings[code]=Math.max(0, Date.now()-testState.shownAt);
      if(testState.idx < FC_ITEMS.length-1){ testState.idx++; testState.shownAt=Date.now(); renderTest(state); } else submitTest();
    }

    async function submitTest(){
      testState.loading=true; renderTest(state);
      try {
        const { data, error } = await sb.functions.invoke('evaluar-competencias', { body: { respuestas: testState.answers, timings: testState.timings } });
        if(error || !data || data.error) throw (error || new Error(data && data.error || 'Error'));
        state.testResults = { clasificacion: data.clasificacion, arquetipo: data.arquetipo, modelo: data.modelo };
      } catch(e){
        console.error('Test IA falló:', e);
        testState.loading=false; testState.active=true; renderTest(state);
        alert('No se pudo procesar tu test. Revisa tu conexión e inténtalo de nuevo.');
        return;
      }
      testState.loading=false; testState.active=false;
      renderTest(state); renderPerfil(state);
    }

    function radarSVG(ejes, size){
      size = size || 300; const cx=size/2, cy=size/2+6, R=size*0.34, n=AXES.length;
      const ang=i=>(-90+i*(360/n))*Math.PI/180, pt=(i,r)=>[cx+Math.cos(ang(i))*r, cy+Math.sin(ang(i))*r];
      let g='';
      [0.25,0.5,0.75,1].forEach(f=>{ g+=`<polygon points="${AXES.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#E5E9F5" stroke-width="1"/>`; });
      AXES.forEach((_,i)=>{ const [x,y]=pt(i,R); g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#E5E9F5" stroke-width="1"/>`; });
      g+=`<polygon points="${AXES.map((a,i)=>pt(i,R*(ejes[a.key]||0)/100).map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="url(#zrad)" fill-opacity="0.55" stroke="#7B68EE" stroke-width="2" stroke-linejoin="round"/>`;
      AXES.forEach((a,i)=>{ const [x,y]=pt(i,R*(ejes[a.key]||0)/100); g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#7B68EE"/>`; });
      AXES.forEach((a,i)=>{ let [x,y]=pt(i,R+16); const co=Math.cos(ang(i)); const anchor=Math.abs(co)<0.3?'middle':(co>0?'start':'end'); g+=`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${anchor}" font-size="10.5" font-weight="700" fill="#475569">${a.short}</text>`; });
      return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:320px;display:block;margin:0 auto"><defs><linearGradient id="zrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B68EE"/><stop offset="1" stop-color="#4A9EFF"/></linearGradient></defs>${g}</svg>`;
    }

    // Opción C: top-3 tarjetas + barras, con NIVEL (afinidad, no calificación).
    function nivelOf(v){ return v>=75?'Muy marcado':v>=50?'Marcado':v>=25?'Presente':'Poco marcado'; }
    function nivelColor(v){ return v>=75?'#6D5AE6':v>=50?'#8B7FEF':v>=25?'#94A3B8':'#B6C0CE'; }
    function strengthsC(ejes){
      const rk = AXES.slice().sort((a,b)=>(ejes[b.key]||0)-(ejes[a.key]||0));
      const mx = Math.max(1, ...AXES.map(a=>ejes[a.key]||0));
      const nz = v => Math.round((v||0)/mx*100);
      const card = (a,i)=>{ const v=ejes[a.key]||0; return `<div style="position:relative;background:#fff;border:1px solid #E8EBF5;border-radius:14px;padding:14px 6px 13px;text-align:center;overflow:hidden;"><div style="position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#7B68EE,#4A9EFF);"></div><div style="font-size:10px;font-weight:800;color:#C4B5FD;">#${i+1}</div><div style="font-size:12px;font-weight:800;line-height:1.2;margin-top:5px;color:#0F172A;min-height:29px;display:flex;align-items:center;justify-content:center;">${escapeHTML(a.label)}</div><div style="font-size:11px;font-weight:800;color:${nivelColor(v)};margin-top:4px;">${nivelOf(v)}</div></div>`; };
      const mini = a=>{ const v=ejes[a.key]||0; return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;"><span style="font-size:12.5px;color:#475569;font-weight:600;flex:1;">${escapeHTML(a.label)}</span><div style="width:60px;height:6px;background:#E9ECF6;border-radius:999px;overflow:hidden;"><div style="width:${nz(v)}%;height:100%;background:linear-gradient(90deg,#7B68EE,#4A9EFF);border-radius:999px;"></div></div><span style="font-size:10.5px;font-weight:700;color:${nivelColor(v)};width:84px;text-align:right;">${nivelOf(v)}</span></div>`; };
      return `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;">${rk.slice(0,3).map(card).join('')}</div><div style="font-size:11px;color:#94A3B8;line-height:1.5;margin-bottom:14px;">Mide cuánto te inclinas hacia cada estilo cuando puedes elegir — no qué tan bueno eres.</div><div style="font-size:11px;font-weight:800;color:#94A3B8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;">Los demás estilos</div>${rk.slice(3).map(mini).join('')}`;
    }

    function renderTest(state){
      const el = document.getElementById('sec-test');
      const c = state.testResults && state.testResults.clasificacion;
      const hasResult = !!(c && c.ejes);

      if(testState.loading){
        el.innerHTML = `<div class="test-quiz" style="text-align:center;padding:56px 24px;">
          <div class="test-spinner"></div>
          <div style="font-size:16px;font-weight:800;color:#0F172A;margin-top:18px;">Analizando tu perfil…</div>
          <div style="font-size:13px;color:#64748B;margin-top:6px;line-height:1.5;">Nuestra IA está interpretando tus resultados y tu feedback personalizado.</div>
        </div>`;
        return;
      }

      if(testState.active){
        const step = FC_ITEMS[testState.idx];
        const n = FC_ITEMS.length;
        const prog = Math.round((testState.idx / n) * 100);
        const order = fcOrder(testState.idx);
        const sel = testState.answers[step.code];
        const body = `<div class="test-q-text">${escapeHTML(step.q)}</div>
          <div class="test-q-opts">${order.map(canon=>`<button class="test-opt ${sel===canon?'sel':''}" onclick="pickOpt(${testState.idx},${canon})">${escapeHTML(step.opts[canon])}</button>`).join('')}</div>`;
        el.innerHTML = `<div class="test-quiz">
          <div class="test-q-top">
            <button class="test-q-back" onclick="testBack()" aria-label="Atrás">${testState.idx>0?'‹':'✕'}</button>
            <div class="test-q-count">Pregunta ${testState.idx+1} de ${n}</div>
          </div>
          <div class="test-q-track"><div class="test-q-fill" style="width:${prog}%"></div></div>
          <div style="font-size:12px;font-weight:800;color:#94A3B8;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;">Elige lo que más se parece a ti</div>
          ${body}
        </div>`;
        const sc=document.querySelector('.scroll-content'); if(sc) sc.scrollTop=0;
        return;
      }

      if(hasResult){ el.innerHTML = renderTestResult(c); return; }

      el.innerHTML = `
        <div class="test-banner">
          <div class="test-banner-icon">🧭</div>
          <div>
            <div class="test-banner-title">Test de Talento IA</div>
            <div class="test-banner-sub">18 preguntas · ~8 min</div>
          </div>
          <button class="test-banner-btn" onclick="startTest()">Empezar →</button>
        </div>
        <div class="section-title">¿Qué obtienes?</div>
        <div class="card" style="margin:0 20px 24px;padding:18px 20px;">
          <div style="font-size:13px;color:#475569;line-height:1.7;">En cada pregunta eliges <strong>la opción que más se parece a ti</strong> — no hay respuestas correctas. Con eso construimos tu <strong>perfil de fortalezas</strong> en 8 competencias (gráfica de radar), un <strong>feedback personalizado</strong> y los roles que más encajan contigo. Es lo que ven los reclutadores.</div>
        </div>`;
    }

    function renderTestResult(c){
      const fb = c.feedback_estudiante || {};
      const ejes = c.ejes || {};
      const tags = (Array.isArray(c.tags)?c.tags:[]).map(t=>`<span class="chip">${escapeHTML(t)}</span>`).join('');
      const fbCard = (title, txt, color) => txt ? `<div class="fb-card"><div class="fb-title" style="color:${color}">${title}</div><div class="fb-body">${escapeHTML(txt)}</div></div>` : '';
      return `
        <div class="result-hero">
          <div class="result-arq">${escapeHTML(c.cintillo || ('Perfil '+(c.arquetipo||'')))}</div>
          ${c.arquetipo?`<div class="result-badge">Estilo dominante · ${escapeHTML(c.arquetipo)}</div>`:''}
          ${tags?`<div class="result-tags">${tags}</div>`:''}
        </div>
        <div class="section-title">Tu perfil de fortalezas</div>
        <div class="card" style="margin:0 20px 20px;padding:18px 18px;">${strengthsC(ejes)}</div>
        ${c.descripcion_breve?`<div class="card" style="margin:0 20px 20px;padding:16px 20px;"><div style="font-size:13.5px;color:#334155;line-height:1.6;">${escapeHTML(c.descripcion_breve)}</div></div>`:''}
        ${fb.mensaje_completo ? `<div class="card" style="margin:0 20px 20px;padding:18px 20px;"><div class="fb-message">${escapeHTML(fb.mensaje_completo)}</div></div>`:''}
        <div class="section-title">Tu feedback</div>
        <div style="padding:0 20px;">
          ${fbCard('💪 Tus fortalezas', fb.fortalezas, '#10B981')}
          ${fbCard('🌱 Estilo a explorar', fb.areas_mejora, '#F59E0B')}
          ${fbCard('🚀 Qué hacer ahora', fb.recomendaciones, '#7B68EE')}
        </div>
        ${c.recomendacion?`<div class="card" style="margin:0 20px 20px;padding:16px 20px;"><div style="font-size:12px;font-weight:800;color:#94A3B8;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;">Roles que encajan contigo</div><div style="font-size:13.5px;color:#334155;line-height:1.5;">${escapeHTML(c.recomendacion)}</div></div>`:''}
        <div style="padding:0 20px 24px;"><button class="test-banner-btn" style="width:100%;justify-content:center;" onclick="startTest()">Volver a tomar el test →</button></div>`;
    }

    // ── RENDER: BANDEJA DE ENTRADA ──────────────────────────
    const COMPANY_COLORS = [
      'linear-gradient(135deg,#EF4444,#F97316)',
      'linear-gradient(135deg,#F59E0B,#EF4444)',
      'linear-gradient(135deg,#7B68EE,#4A9EFF)',
      'linear-gradient(135deg,#10B981,#4A9EFF)',
      'linear-gradient(135deg,#EC4899,#8B5CF6)',
    ];

    function timeAgo(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 60) return `hace ${mins}m`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `hace ${hrs}h`;
      const days = Math.floor(hrs / 24);
      if (days === 1) return 'ayer';
      if (days < 7) return `hace ${days}d`;
      return new Date(dateStr).toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
    }

    function companyMeta(id) {
      const c = (state.companies || {})[id] || {};
      const name = c.nombre_empresa || c.email_corporativo || 'Empresa';
      const contact = [c.nombre_contacto, c.apellido_contacto].filter(Boolean).join(' ');
      return { name, contact, cargo: c.cargo || '' };
    }
    function avatarColor(id) {
      const s = (id || '').toString();
      let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return COMPANY_COLORS[h % COMPANY_COLORS.length];
    }
    function initialsOf(name) {
      return (name || 'E').trim().slice(0, 2).toUpperCase();
    }
    function buildConversations(messages) {
      const by = {};
      messages.forEach(m => { (by[m.company_id] = by[m.company_id] || []).push(m); });
      return Object.keys(by).map(cid => {
        const msgs = by[cid].slice().sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
        const last = msgs[msgs.length - 1];
        const unread = msgs.filter(m => !m.leido && m.sender_type === 'company').length;
        return { companyId: cid, msgs, last, unread };
      }).sort((a, b) => new Date(b.last.created_at) - new Date(a.last.created_at));
    }

    function renderInbox({ messages }) {
      const convos = buildConversations(messages);
      const unreadTotal = messages.filter(m => !m.leido && m.sender_type === 'company').length;

      const badge = document.getElementById('inbox-badge');
      const notifDot = document.getElementById('notif-dot');
      if (unreadTotal > 0) {
        badge.textContent = unreadTotal; badge.style.display = 'flex'; notifDot.style.display = 'block';
      } else {
        badge.style.display = 'none'; notifDot.style.display = 'none';
      }

      const itemsHTML = convos.length === 0
        ? `<div style="padding:44px 20px;text-align:center;"><div style="font-size:38px;margin-bottom:12px;">📭</div><div style="font-size:14px;font-weight:800;color:#0F172A;">Aún no tienes mensajes</div><div style="font-size:13px;color:#64748B;margin-top:6px;line-height:1.5;">Completa tu perfil para que las empresas te descubran y te escriban aquí.</div></div>`
        : convos.map(cv => {
            const meta = companyMeta(cv.companyId);
            const preview = escapeHTML(cv.last.contenido.length > 58 ? cv.last.contenido.slice(0, 58) + '…' : cv.last.contenido);
            const mine = cv.last.sender_type === 'student';
            return `
              <div class="inbox-item ${cv.unread ? 'unread' : ''}" role="button" tabindex="0" data-cid="${escapeHTML(cv.companyId)}" onclick="openThread(this.dataset.cid)">
                <div class="inbox-avatar" style="background:${avatarColor(cv.companyId)}">${escapeHTML(initialsOf(meta.name))}</div>
                <div style="flex:1;min-width:0;">
                  <div class="inbox-company">${escapeHTML(meta.name)}</div>
                  <div class="inbox-preview">${mine ? '<span style="color:#94A3B8;">Tú: </span>' : ''}${preview}</div>
                </div>
                <div class="inbox-meta">
                  <span class="inbox-time">${timeAgo(cv.last.created_at)}</span>
                  ${cv.unread ? `<div class="inbox-badge-count">${cv.unread}</div>` : ''}
                </div>
              </div>`;
          }).join('');

      document.getElementById('sec-inbox').innerHTML = `
        <div class="section-title" style="padding-top:16px;">Mensajes</div>
        <div class="inbox-hint">Empresas interesadas en tu perfil. Responde para empezar la conversación.</div>
        <div class="card" style="margin:0 20px 24px;overflow:hidden;">${itemsHTML}</div>
      `;
    }

    // ── Hilo de conversación ────────────────────────────────
    function openThread(companyId) {
      state.activeThread = companyId;
      const toMark = state.messages.filter(m => m.company_id === companyId && m.sender_type === 'company' && !m.leido);
      if (toMark.length) {
        toMark.forEach(m => { m.leido = true; });
        dbMarkThreadRead(companyId).catch(() => {});
      }
      document.getElementById('chat-overlay').classList.add('open');
      renderThread(companyId);
      renderInbox(state);
    }
    function closeThread() {
      state.activeThread = null;
      document.getElementById('chat-overlay').classList.remove('open');
      document.getElementById('chat-overlay').innerHTML = '';
    }
    function renderThread(companyId) {
      const meta = companyMeta(companyId);
      const msgs = state.messages
        .filter(m => m.company_id === companyId)
        .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

      const bubbles = msgs.map((m, i) => {
        const mine = m.sender_type === 'student';
        const next = msgs[i + 1];
        const showTime = !next || next.sender_type !== m.sender_type || (new Date(next.created_at) - new Date(m.created_at) > 1000 * 60 * 10);
        return `
          <div class="bubble-row ${mine ? 'mine' : ''}">
            <div class="bubble ${mine ? 'bubble-mine' : 'bubble-them'}">${escapeHTML(m.contenido)}</div>
            ${showTime ? `<div class="bubble-time">${timeAgo(m.created_at)}</div>` : ''}
          </div>`;
      }).join('');

      const subtitle = [meta.contact, meta.cargo].filter(Boolean).join(' · ');

      document.getElementById('chat-overlay').innerHTML = `
        <div class="chat-head">
          <button class="chat-back" onclick="closeThread()" aria-label="Volver">
            <svg width="22" height="22" fill="none" stroke="#0F172A" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
          </button>
          <div class="chat-avatar" style="background:${avatarColor(companyId)}">${escapeHTML(initialsOf(meta.name))}</div>
          <div style="min-width:0;flex:1;">
            <div class="chat-title">${escapeHTML(meta.name)}</div>
            ${subtitle ? `<div class="chat-sub">${escapeHTML(subtitle)}</div>` : ''}
          </div>
        </div>
        <div class="chat-body" id="chat-body">
          <div class="chat-intro">🔒 Esta conversación es privada entre tú y ${escapeHTML(meta.name)}.</div>
          ${bubbles}
        </div>
        <form class="chat-composer" onsubmit="return sendThreadMessage(event)">
          <input id="chat-input" class="chat-input" type="text" placeholder="Escribe un mensaje…" autocomplete="off" maxlength="1000" />
          <button type="submit" class="chat-send" aria-label="Enviar">
            <svg width="20" height="20" fill="none" stroke="#fff" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>`;

      const body = document.getElementById('chat-body');
      if (body) body.scrollTop = body.scrollHeight;
      const input = document.getElementById('chat-input');
      if (input) input.focus();
    }
    async function sendThreadMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = (input.value || '').trim();
      if (!text || !state.activeThread) return false;
      const companyId = state.activeThread;
      input.value = '';
      const optimistic = { id: 'tmp-' + Date.now(), company_id: companyId, contenido: text, leido: true, sender_type: 'student', created_at: new Date().toISOString() };
      state.messages.push(optimistic);
      renderThread(companyId);
      try {
        const saved = await dbSendMessage(companyId, text);
        if (saved) { optimistic.id = saved.id; if (saved.created_at) optimistic.created_at = saved.created_at; }
      } catch (err) {
        state.messages = state.messages.filter(m => m !== optimistic);
        renderThread(companyId);
        alert('No se pudo enviar el mensaje. Intenta de nuevo.');
      }
      renderInbox(state);
      return false;
    }

    // ── RENDER: OFERTAS DE EMPLEO ───────────────────────────
    function offerMatch(o) {
      const st = state.student || {};
      const skills = (Array.isArray(st.hard_skills) ? st.hard_skills : []).map(_norm);
      const inds = (Array.isArray(st.industrias) ? st.industrias : []).map(_norm);
      const tags = (Array.isArray(o.tags) ? o.tags : []).map(_norm);
      let hits = 0;
      tags.forEach(t => { if (skills.some(s => s.includes(t) || t.includes(s)) || inds.some(i => i.includes(t) || t.includes(i))) hits++; });
      const ratio = tags.length ? hits / tags.length : 0;
      return Math.max(62, Math.min(98, Math.round(62 + ratio * 36)));
    }

    function renderOfertas() {
      document.getElementById('sec-ofertas').innerHTML = `
        <div class="swipe-stats">
          <div class="swipe-stat"><div class="swipe-stat-n" style="color:#10B981;">${state.appliedCount}</div><div class="swipe-stat-l">Aplicadas</div></div>
          <div class="swipe-stat"><div class="swipe-stat-n" style="color:#F59E0B;">${state.savedCount}</div><div class="swipe-stat-l">Guardadas</div></div>
          <div class="swipe-stat"><div class="swipe-stat-n" style="color:#7B68EE;">${state.offers.length}</div><div class="swipe-stat-l">Disponibles</div></div>
        </div>
        <div class="swipe-wrapper" id="swipe-wrapper"></div>
      `;
      renderJobCard();
    }

    function renderJobCard() {
      const wrapper = document.getElementById('swipe-wrapper');
      if (!state.offers.length || state.offersIdx >= state.offers.length) {
        const done = state.offers.length > 0;
        wrapper.innerHTML = `
          <div style="text-align:center;padding:48px 20px;">
            <div style="font-size:48px;margin-bottom:16px;">${done ? '🎉' : '📭'}</div>
            <div style="font-size:16px;font-weight:800;color:#0F172A;margin-bottom:6px;">${done ? '¡Revisaste todas las ofertas!' : 'Aún no hay ofertas'}</div>
            <div style="font-size:13px;color:#64748B;">${done ? 'Vuelve pronto para ver nuevas oportunidades.' : 'Las empresas publicarán vacantes muy pronto.'}</div>
          </div>`;
        return;
      }

      const j = state.offers[state.offersIdx];
      const color = avatarColor(j.empresa_nombre || j.titulo);
      const initial = initialsOf(j.empresa_nombre || 'Z');
      const match = offerMatch(j);
      const loc = [j.ubicacion, j.modalidad].filter(Boolean).join(' · ');
      const tags = Array.isArray(j.tags) ? j.tags : [];
      const dots = state.offers.map((_, i) => `<div class="swipe-dot ${i === state.offersIdx ? 'current' : ''}"></div>`).join('');

      wrapper.innerHTML = `
        <div class="job-card" style="--accent:${color}">
          <style>.job-card::before{background:${color};}</style>
          <div class="job-top">
            <div class="job-logo" style="background:${color}">${escapeHTML(initial)}</div>
            <div>
              <div class="job-company">${escapeHTML(j.empresa_nombre || 'Empresa')}${loc ? ' · ' + escapeHTML(loc) : ''}</div>
              <div class="job-title">${escapeHTML(j.titulo)}</div>
              ${j.salario ? `<div class="job-location">💰 ${escapeHTML(j.salario)}</div>` : ''}
            </div>
          </div>
          <div class="job-match-pill">
            <span class="job-match-num">${match}%</span>
            <span class="job-match-txt">match con tu perfil</span>
          </div>
          ${tags.length ? `<div class="job-tags">${tags.map(t => `<span class="job-tag">${escapeHTML(t)}</span>`).join('')}</div>` : ''}
          ${j.descripcion ? `<p class="job-desc">${escapeHTML(j.descripcion)}</p>` : ''}
          <div class="swipe-btns">
            <button class="swipe-btn no" onclick="swipeAction('no')" title="Descartar">✕</button>
            <button class="swipe-btn save" onclick="swipeAction('save')" title="Guardar">★</button>
            <button class="swipe-btn yes" onclick="swipeAction('yes')" title="Aplicar">✓</button>
          </div>
        </div>
        <div class="swipe-counter-bar">${dots}</div>
        <div class="swipe-hint">${state.offersIdx + 1} de ${state.offers.length} ofertas</div>
      `;
    }

    async function swipeAction(action) {
      const j = state.offers[state.offersIdx];
      if (!j) return;
      if (action === 'yes' || action === 'save') {
        const estado = action === 'yes' ? 'aplicada' : 'guardada';
        if (action === 'yes') state.appliedCount++; else state.savedCount++;
        state.offersIdx++;
        renderOfertas();
        try { await dbApplyOffer(j.id, estado); }
        catch (e) { if (action === 'yes') state.appliedCount--; else state.savedCount--; renderOfertas(); alert('No se pudo registrar. Intenta de nuevo.'); }
        return;
      }
      state.offersIdx++;
      renderOfertas();
    }

    init();

    const sectionTitles = { perfil:'Mi Perfil', test:'Test de Habilidades', inbox:'Bandeja de Entrada', ofertas:'Ofertas de Empleo' };

    function showSection(id) {
      if (!document.getElementById('sec-' + id)) return;
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.getElementById('sec-' + id).classList.add('active');
      document.getElementById('tab-' + id).classList.add('active');
      document.getElementById('topbar-greeting').textContent = sectionTitles[id];
      document.querySelector('.scroll-content').scrollTop = 0;
    }

    function toggleFullTest() {
      const p = document.getElementById('rc-full-test');
      const b = document.getElementById('rc-test-toggle');
      if (!p) return;
      const open = p.style.display === 'none';
      p.style.display = open ? 'block' : 'none';
      if (b) b.textContent = open ? 'Ocultar resultados del Test IA' : 'Ver resultados del Test IA →';
    }
    function previewSendMessage() {
      const n = document.getElementById('rc-msg-note');
      if (n) n.style.display = 'block';
    }
    function openModal() { document.getElementById('modal').classList.add('open'); }
    function closeModal() { document.getElementById('modal').classList.remove('open'); }
    function closeModalOutside(e) { if (!e.target.closest('.modal-sheet')) closeModal(); }

    // ── Selector de tema del hero ───────────────────────────
    const HERO_THEMES = [
      { id:'aurora',   name:'Aurora',    desc:'Vibrante, con luces de color', swatch:'background:radial-gradient(circle at 20% 20%,#8B5CF6,transparent 60%),radial-gradient(circle at 80% 80%,#EC4899,transparent 60%),#0C0A28;' },
      { id:'midnight', name:'Midnight',  desc:'Índigo profundo, premium',     swatch:'background:radial-gradient(120% 120% at 80% 0%,#322A78,#120E30);' },
      { id:'monogram', name:'Monograma', desc:'Morado de marca con la “Z”',   swatch:'background:linear-gradient(135deg,#6D5AE6,#4A9EFF);' },
    ];
    function openThemeSheet() {
      const cur = (state.student && state.student.tema) || 'aurora';
      document.getElementById('theme-options').innerHTML = HERO_THEMES.map(t => `
        <div class="theme-row" onclick="setTheme('${t.id}')">
          <div class="theme-swatch" style="${t.swatch}"></div>
          <div style="flex:1;"><div class="theme-name">${t.name}</div><div class="theme-desc">${escapeHTML(t.desc)}</div></div>
          ${cur === t.id ? '<div class="theme-check">✓</div>' : ''}
        </div>`).join('');
      document.getElementById('theme-modal').classList.add('open');
    }
    async function setTheme(id) {
      try { await dbUpsertStudent(state.user, { tema: id }); } catch (e) { console.error('No se pudo guardar el tema:', e); }
      document.getElementById('theme-modal').classList.remove('open');
      renderPerfil(state);
    }
    function closeThemeOutside(e) { if (!e.target.closest('.modal-sheet')) document.getElementById('theme-modal').classList.remove('open'); }

    // ── EDIT SHEET (motor config-driven) ─────────────────────
    let editSectionId = null;
    let editDraft = {};

    function skillChipsHTML() {
      return (editDraft.hard_skills||[]).map((s,i)=>`<span class="skill-chip">${escapeHTML(s)}<button type="button" onclick="removeSkillAt(${i})">✕</button></span>`).join('');
    }

    function fieldHTML(f) {
      const val = editDraft[f.key];
      if (f.type === 'textarea')
        return `<textarea class="field-textarea" data-key="${f.key}" placeholder="${escapeHTML(f.placeholder||'')}">${escapeHTML(val||'')}</textarea>`;
      if (f.type === 'select')
        return `<select class="field-select" data-key="${f.key}"><option value="">Selecciona…</option>${f.options.map(o=>`<option ${val===o?'selected':''}>${o}</option>`).join('')}</select>`;
      if (f.type === 'tags') {
        const sel = Array.isArray(val) ? val : [];
        return `<div data-key="${f.key}" data-type="tags">${f.options.map(o=>`<span class="tag-opt ${sel.includes(o)?'sel':''}" onclick="toggleTag(this)">${o}</span>`).join('')}</div>`;
      }
      if (f.type === 'skills') {
        return `<div data-key="${f.key}" data-type="skills">
          <div id="skill-chips">${skillChipsHTML()}</div>
          <div style="display:flex;gap:8px;margin-top:6px;"><input class="field-input" id="skill-input" placeholder="Ej. SQL, Figma, Python"/><button class="progress-cta" style="color:#4A2FD6;" onclick="addSkill()">Añadir</button></div>
          <div style="font-size:11.5px;color:#94A3B8;margin-top:6px;">Añade al menos 3.</div></div>`;
      }
      if (f.type === 'photo') {
        const src = val || '';
        const preview = src
          ? `<img class="photo-preview" id="photo-preview" src="${escapeHTML(src)}" onclick="triggerFotoInput()" style="cursor:pointer;"/>`
          : `<div class="photo-preview" id="photo-preview" onclick="triggerFotoInput()" style="display:flex;align-items:center;justify-content:center;background:#EEF2FF;color:#7B68EE;font-weight:900;cursor:pointer;">＋</div>`;
        return `<div data-key="${f.key}" data-type="photo">
          <div style="display:flex;align-items:center;gap:12px;">
            ${preview}
            <button type="button" class="progress-cta" style="color:#4A2FD6;" onclick="triggerFotoInput()">Subir foto</button>
            <input id="foto-file-input" type="file" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;" onchange="onPhotoPick(event)"/>
          </div></div>`;
      }
      if (f.type === 'checkbox') {
        return `<label class="chk-row" data-key="${f.key}" data-type="checkbox"><input type="checkbox" ${val ? 'checked' : ''}/><span>${escapeHTML(f.label)}</span></label>`;
      }
      const t = f.type === 'url' ? 'url' : (f.type === 'tel' ? 'tel' : 'text');
      return `<input class="field-input" type="${t}" data-key="${f.key}" value="${escapeHTML(val||'')}" placeholder="${escapeHTML(f.placeholder||'')}"/>`;
    }

    function openEditSheet(sectionId) {
      const sec = PROFILE_SECTIONS.find(s => s.id === sectionId);
      if (!sec) return;
      editSectionId = sectionId;
      editDraft = {};
      sec.fields.forEach(f => { editDraft[f.key] = state.student ? state.student[f.key] : null; });
      document.getElementById('edit-title').textContent = sec.label;
      const habNote = sectionId === 'habilidades'
        ? `<div class="hab-note">🧠 Con 3+ herramientas ya completas esta sección. El <strong>Test IA</strong> es opcional y potencia tu match con las empresas. <span class="hab-link" onclick="goToTest()">Verlo en Test →</span></div>`
        : '';
      document.getElementById('edit-body').innerHTML = habNote + sec.fields.map(f =>
        f.type === 'checkbox'
          ? `<div class="field">${fieldHTML(f)}</div>`
          : `<div class="field"><label class="field-label">${escapeHTML(f.label)}</label>${fieldHTML(f)}</div>`).join('');
      document.getElementById('edit-error').style.display = 'none';
      document.getElementById('edit-modal').classList.add('open');
    }
    function closeEditSheet() { document.getElementById('edit-modal').classList.remove('open'); }
    function goToTest() { closeEditSheet(); showSection('test'); }
    function closeEditOutside(e) { if (!e.target.closest('.modal-sheet')) closeEditSheet(); }

    function toggleTag(el) { el.classList.toggle('sel'); }
    function addSkill() {
      const input = document.getElementById('skill-input');
      const v = input.value.trim();
      if (!v) return;
      const cur = Array.isArray(editDraft.hard_skills) ? editDraft.hard_skills : [];
      if (!cur.includes(v)) cur.push(v);
      editDraft.hard_skills = cur;
      input.value = '';
      rerenderSkills();
    }
    function removeSkillAt(i) {
      (editDraft.hard_skills||[]).splice(i, 1);
      rerenderSkills();
    }
    function rerenderSkills() {
      document.getElementById('skill-chips').innerHTML = skillChipsHTML();
    }
    function triggerFotoInput() {
      const inp = document.getElementById('foto-file-input');
      if (inp) inp.click();
    }

    function toggleEditPanel() {
      const p = document.getElementById('edit-panel');
      if (p) p.style.display = p.style.display === 'none' ? 'block' : 'none';
    }

    async function onPhotoPick(e) {
      const file = e.target.files[0]; if (!file) return;
      const errEl = document.getElementById('edit-error');
      const el = document.getElementById('photo-preview');
      const prevHTML = el ? el.outerHTML : '';
      // Estado "subiendo…"
      if (el) el.outerHTML = `<div class="photo-preview" id="photo-preview" style="display:flex;align-items:center;justify-content:center;background:#EEF2FF;color:#7B68EE;font-size:11px;font-weight:700;">…</div>`;
      try {
        const url = await dbUploadAvatar(state.user, file);
        editDraft.foto_url = url;
        const cur = document.getElementById('photo-preview');
        if (cur) cur.outerHTML = `<img class="photo-preview" id="photo-preview" src="${escapeHTML(url)}" onclick="triggerFotoInput()" style="cursor:pointer;"/>`;
        if (errEl) errEl.style.display = 'none';
      } catch (err) {
        console.error('Avatar upload failed:', err);
        const cur = document.getElementById('photo-preview');
        if (cur) cur.outerHTML = prevHTML;
        if (errEl) {
          errEl.textContent = 'No se pudo subir la foto (' + (err && err.message ? err.message : 'error') + '). Puedes guardar sin foto y subirla después.';
          errEl.style.display = 'block';
        }
      }
    }

    function collectDraft() {
      document.querySelectorAll('#edit-body [data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        const type = el.getAttribute('data-type');
        if (type === 'tags') editDraft[key] = [...el.querySelectorAll('.tag-opt.sel')].map(t => t.textContent);
        else if (type === 'skills' || type === 'photo') { /* ya en editDraft */ }
        else if (type === 'checkbox') editDraft[key] = el.querySelector('input').checked;
        else if (el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') editDraft[key] = el.value.trim();
      });
    }
    function validateDraft(sec) {
      if (sec.id === 'links' && editDraft.links_later) return null;
      for (const f of sec.fields) {
        if (!f.required) continue;
        if (f.type === 'skills' && (!(editDraft[f.key]||[]).length || editDraft[f.key].length < 3)) return 'Añade al menos 3 habilidades.';
        if (f.type === 'tags' && !(editDraft[f.key]||[]).length) return 'Selecciona al menos una opción.';
        if (!editDraft[f.key] || !String(editDraft[f.key]).trim()) return `Completa: ${f.label}.`;
        if (f.type === 'url' && !/^https?:\/\//.test(editDraft[f.key])) return 'Los links deben empezar con http(s)://';
        if (f.type === 'tel' && String(editDraft[f.key]).replace(/\D/g,'').length < 10) return 'Ingresa un teléfono válido (al menos 10 dígitos).';
      }
      return null;
    }
    async function saveEditSheet() {
      const sec = PROFILE_SECTIONS.find(s => s.id === editSectionId);
      collectDraft();
      const err = validateDraft(sec);
      const errEl = document.getElementById('edit-error');
      if (err) { errEl.textContent = err; errEl.style.display = 'block'; return; }
      const patch = {};
      sec.fields.forEach(f => { patch[f.key] = editDraft[f.key]; });
      await dbUpsertStudent(state.user, patch);
      await maybeUnlockRecruiting();
      closeEditSheet();
      renderPerfil(state);
    }
    async function maybeUnlockRecruiting() {
      const { pct } = computeProgress(state.student, state.testResults);
      let target = null;
      if (pct < 100) {
        if (state.student.estado !== 'incompleto') target = 'incompleto';
      } else if (!state.student.estado || state.student.estado === 'incompleto') {
        target = 'en_busqueda'; // recién completado: reclutable por defecto
      }
      // Si ya eligió 'en_busqueda' o 'no_reclutable', se respeta (no se pisa).
      if (target && state.student.estado !== target) {
        await dbUpsertStudent(state.user, { estado: target });
      }
    }
    async function setEstado(estado) {
      if (!state.student || state.student.estado === estado) return;
      try { await dbUpsertStudent(state.user, { estado }); }
      catch (e) { console.error('No se pudo cambiar estado:', e); alert('No se pudo actualizar tu estado. Inténtalo de nuevo.'); return; }
      renderPerfil(state);
    }
  </script>
</body>
</html>
