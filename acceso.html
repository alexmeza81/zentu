<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acceder — ZentU</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background-color: #F9FAFB;
      background-image:
        radial-gradient(circle at 12% 40%, rgba(123,104,238,0.09) 0%, transparent 50%),
        radial-gradient(circle at 88% 70%, rgba(74,158,255,0.08)  0%, transparent 50%),
        radial-gradient(circle at 55% 5%,  rgba(13,148,136,0.06)  0%, transparent 40%);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 0 0 1px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.06), 0 24px 48px rgba(0,0,0,.10);
      width: 100%; max-width: 420px;
      padding: 40px 36px;
    }

    .step { display: block; }
    .step.off { display: none; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card { animation: fadeInUp 0.5s cubic-bezier(0.22,1,0.36,1) forwards; }

    .logo {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 32px; text-decoration: none;
    }
    .logo-icon {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, #7B68EE, #4A9EFF);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(123,104,238,0.35);
      flex-shrink: 0;
    }
    .logo-name { font-size: 22px; font-weight: 900; letter-spacing: -0.03em; color: #0F172A; }

    .step-title { font-size: 20px; font-weight: 800; color: #0F172A; letter-spacing: -0.02em; margin-bottom: 6px; }
    .step-sub   { font-size: 13.5px; color: #64748B; margin-bottom: 28px; line-height: 1.5; }

    .f-label {
      display: block; font-size: 11.5px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: #64748B; margin-bottom: 7px;
    }
    .z-input {
      width: 100%; background: #F8FAFC; border: 1.5px solid #E2E8F0;
      border-radius: 11px; color: #0F172A;
      padding: 13px 15px; font-family: 'Inter', sans-serif; font-size: 15px;
      transition: all 0.2s; outline: none;
    }
    .z-input::placeholder { color: #CBD5E1; }
    .z-input:focus { border-color: #7B68EE; background: #fff; box-shadow: 0 0 0 3px rgba(123,104,238,0.12); }

    .fg { margin-bottom: 20px; }

    .btn-primary {
      width: 100%; padding: 13px; border-radius: 12px; border: none; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700;
      color: #fff; background: linear-gradient(135deg, #7B68EE, #4A9EFF);
      box-shadow: 0 4px 16px rgba(123,104,238,0.35);
      transition: all 0.3s;
    }
    .btn-primary:hover    { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(123,104,238,0.45); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .auth-msg { padding: 11px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; margin-bottom: 18px; }
    .msg-err  { background: #FEF2F2; border: 1px solid #FECACA; color: #B91C1C; }
    .msg-ok   { background: #F0FDF4; border: 1px solid #BBF7D0; color: #166534; }

    /* 6-digit code inputs */
    .code-row {
      display: flex; gap: 8px; justify-content: center;
      margin-bottom: 24px;
    }
    .code-box {
      width: 48px; height: 58px; border-radius: 11px;
      border: 2px solid #E2E8F0; background: #F8FAFC;
      font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 900;
      color: #0F172A; text-align: center; outline: none;
      transition: all 0.2s; caret-color: transparent;
    }
    .code-box:focus { border-color: #7B68EE; background: #fff; box-shadow: 0 0 0 3px rgba(123,104,238,0.12); }
    .code-box.filled { border-color: #7B68EE; color: #7B68EE; }

    .resend-row { text-align: center; margin-top: 16px; font-size: 13px; color: #94A3B8; }
    .resend-btn {
      background: none; border: none; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700;
      color: #7B68EE; padding: 0; transition: color 0.2s;
    }
    .resend-btn:hover    { color: #4338CA; }
    .resend-btn:disabled { color: #CBD5E1; cursor: not-allowed; }

    .back-btn {
      background: none; border: none; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600;
      color: #94A3B8; padding: 0; margin-top: 14px;
      display: flex; align-items: center; gap: 5px; transition: color 0.2s;
    }
    .back-btn:hover { color: #475569; }

    .email-display {
      font-size: 13.5px; color: #0F172A; font-weight: 600;
      background: #F1F5F9; border-radius: 8px;
      padding: 8px 12px; margin-bottom: 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .email-display span { color: #64748B; font-size: 12px; font-weight: 400; }
  </style>
</head>
<body>

  <!-- PASO 1 — Email -->
  <div class="card step" id="step1">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
          <polygon points="4,4 20,4 20,8 8,16 20,16 20,20 4,20 4,16 15,8 4,8"/>
        </svg>
      </div>
      <span class="logo-name">ZentU</span>
    </a>

    <h1 class="step-title">Bienvenido de nuevo</h1>
    <p class="step-sub">Ingresa tu correo y te enviamos un código de acceso.</p>

    <div id="msg1" style="display:none;"></div>

    <form id="emailForm" onsubmit="handleEmailSubmit(event)">
      <div class="fg">
        <label class="f-label" for="emailInput">Correo electrónico</label>
        <input id="emailInput" type="email" placeholder="ana@correo.com" required class="z-input" autocomplete="email"/>
      </div>
      <button type="submit" id="emailBtn" class="btn-primary">Enviar código</button>
    </form>
  </div>

  <!-- PASO 2 — Código -->
  <div class="card step off" id="step2">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </div>
      <span class="logo-name">ZentU</span>
    </a>

    <h1 class="step-title">Revisa tu correo</h1>
    <p class="step-sub" id="codeSub">Enviamos un código de 6 dígitos a tu correo.</p>

    <div class="email-display" id="emailDisplay">
      <span id="emailShown">—</span>
      <span>Código enviado</span>
    </div>

    <div id="msg2" style="display:none;"></div>

    <form id="codeForm" onsubmit="handleCodeSubmit(event)">
      <div class="code-row" id="codeRow">
        <input class="code-box" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-label="Código de acceso"/>
        <input class="code-box" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code"/>
        <input class="code-box" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code"/>
        <input class="code-box" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code"/>
        <input class="code-box" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code"/>
        <input class="code-box" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code"/>
      </div>
      <button type="submit" id="codeBtn" class="btn-primary" disabled>Acceder</button>
    </form>

    <div class="resend-row">
      ¿No llegó? <button class="resend-btn" id="resendBtn" onclick="handleResend()">Reenviar código</button>
      <span id="resendTimer" style="display:none;"></span>
    </div>

    <div style="text-align:center;">
      <button class="back-btn" onclick="goToStep1()">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
        Usar otro correo
      </button>
    </div>
  </div>

  <script>
    // ── Config ───────────────────────────────────────────────
    const SUPABASE_URL = 'https://jlivxulenqbgsybqodiv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsaXZ4dWxlbnFiZ3N5YnFvZGl2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgwMjQ5ODEsImV4cCI6MjA4MzYwMDk4MX0.qG4Tx7yB9185vypoZa91y3PPCdphwqXRz8WQKsKBH5g';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const DASHBOARDS = {
      student: 'student_dashboard.html',
      company: 'zentu-company-dashboard.html'
    };

    let currentEmail = '';
    let detectedRole  = null;

    // ── Helpers ──────────────────────────────────────────────
    function showMsg(stepNum, text, isErr) {
      const el = document.getElementById('msg' + stepNum);
      el.className = 'auth-msg ' + (isErr ? 'msg-err' : 'msg-ok');
      el.textContent = text;
      el.style.display = 'block';
    }
    // Igual que showMsg pero permite un enlace de salida. El texto NO viene del
    // usuario: son mensajes fijos de este archivo, por eso el innerHTML es seguro.
    function showMsgHTML(stepNum, html, isErr) {
      const el = document.getElementById('msg' + stepNum);
      el.className = 'auth-msg ' + (isErr ? 'msg-err' : 'msg-ok');
      el.innerHTML = html;
      el.style.display = 'block';
    }
    function clearMsg(stepNum) {
      const el = document.getElementById('msg' + stepNum);
      el.style.display = 'none';
    }
    function setLoading(btnId, on, label) {
      const btn = document.getElementById(btnId);
      btn.disabled = on;
      btn.textContent = on ? 'Procesando...' : label;
    }

    // ── Waitlist check ───────────────────────────────────────
    // Devuelve 'student' | 'company' | null (no está) y lanza si la petición falló.
    // Colapsar ambos casos hacía que una caída del servidor se le presentara al
    // usuario como un rechazo — decía "no estás en la lista" cuando la verdad era
    // que nadie contestó.
    async function checkWaitlist(email) {
      let data, error;
      try {
        ({ data, error } = await sb.rpc('check_waitlist_role', { p_email: email }));
      } catch (netErr) {
        throw netErr; // fallo de red: la promesa se rechaza
      }
      if (error) throw error;
      return data || null;
    }

    // ── Step 1: Email submit ─────────────────────────────────
    async function handleEmailSubmit(e) {
      e.preventDefault();
      clearMsg(1);
      const email = document.getElementById('emailInput').value.trim();
      setLoading('emailBtn', true, 'Enviar código');

      try {
        const role = await checkWaitlist(email);
        if (!role) {
          // No está en la lista: dale la salida en vez de dejarlo sin camino.
          showMsgHTML(1,
            'Este correo no está en nuestra lista de acceso. ' +
            '<a href="waitlist-estudiantes.html" style="text-decoration:underline;font-weight:700">Regístrate como estudiante</a>' +
            ' o <a href="waitlist-empresas.html" style="text-decoration:underline;font-weight:700">como empresa</a>.',
            true);
          return;
        }

        const { error } = await sb.auth.signInWithOtp({
          email,
          options: { shouldCreateUser: true }
        });
        if (error) throw error;

        currentEmail  = email;
        detectedRole  = role;
        localStorage.setItem('zentu_pending_role', role);

        document.getElementById('emailShown').textContent = email;
        goToStep2();
      } catch (err) {
        // Un fallo de petición NO es un rechazo: decirlo tal cual evita que la
        // gente crea que la bloqueamos cuando en realidad el servidor no contestó.
        const offline = (typeof navigator !== 'undefined' && navigator.onLine === false);
        const netish = offline || /fetch|network|failed to|load failed|networkerror/i.test(err && err.message || '');
        showMsg(1, netish
          ? 'No pudimos conectar con el servidor. Revisa tu conexión e inténtalo de nuevo.'
          : (err.message || 'No pudimos enviar el código. Intenta de nuevo.'), true);
      } finally {
        setLoading('emailBtn', false, 'Enviar código');
      }
    }

    // ── Step navigation ──────────────────────────────────────
    function goToStep2() {
      document.getElementById('step1').classList.add('off');
      document.getElementById('step2').classList.remove('off');
      clearMsg(2);
      resetCodeBoxes();
      setTimeout(() => document.querySelectorAll('.code-box')[0].focus(), 80);
    }

    function goToStep1() {
      document.getElementById('step2').classList.add('off');
      document.getElementById('step1').classList.remove('off');
      clearMsg(1);
      currentEmail = '';
      detectedRole  = null;
    }

    // ── Code boxes ───────────────────────────────────────────
    function initCodeBoxes() {
      const boxes = Array.from(document.querySelectorAll('.code-box'));

      // Distribuye un código (autofill/paste/varios dígitos) en los 6 cuadros
      function distribute(text) {
        const digits = (text || '').replace(/\D/g, '').slice(0, 6);
        if (!digits) return;
        boxes.forEach((b, idx) => {
          b.value = digits[idx] || '';
          b.classList.toggle('filled', !!b.value);
        });
        boxes[Math.min(digits.length, 5)].focus();
        checkCodeComplete();
        if (digits.length === 6) document.getElementById('codeForm').requestSubmit();
      }

      boxes.forEach((box, i) => {
        box.addEventListener('input', () => {
          const digits = box.value.replace(/\D/g, '');
          // Autofill del código (iOS one-time-code) o pegado: varios dígitos caen en un solo campo
          if (digits.length > 1) { distribute(digits); return; }
          box.value = digits.slice(-1);
          box.classList.toggle('filled', !!box.value);
          if (box.value && i < 5) boxes[i + 1].focus();
          checkCodeComplete();
        });

        box.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !box.value && i > 0) {
            boxes[i - 1].value = '';
            boxes[i - 1].classList.remove('filled');
            boxes[i - 1].focus();
            checkCodeComplete();
          }
        });
      });

      // Pegar el código de 6 dígitos
      boxes[0].addEventListener('paste', (e) => {
        e.preventDefault();
        distribute((e.clipboardData || window.clipboardData).getData('text'));
      });
    }

    function getCodeValue() {
      return Array.from(document.querySelectorAll('.code-box')).map(b => b.value).join('');
    }

    function checkCodeComplete() {
      const btn = document.getElementById('codeBtn');
      btn.disabled = getCodeValue().length < 6;
    }

    function resetCodeBoxes() {
      document.querySelectorAll('.code-box').forEach(b => {
        b.value = '';
        b.classList.remove('filled');
      });
      document.getElementById('codeBtn').disabled = true;
    }

    // ── Step 2: Code submit ──────────────────────────────────
    async function handleCodeSubmit(e) {
      e.preventDefault();
      clearMsg(2);
      const token = getCodeValue();
      if (token.length < 6) return;

      setLoading('codeBtn', true, 'Acceder');

      try {
        const { data, error } = await sb.auth.verifyOtp({
          email: currentEmail,
          token,
          type: 'email'
        });
        if (error) throw error;

        // Guardar rol en user_metadata
        const role = detectedRole || localStorage.getItem('zentu_pending_role');
        if (role) {
          await sb.auth.updateUser({ data: { role } });
          localStorage.removeItem('zentu_pending_role');
        }

        window.location.href = DASHBOARDS[role] || DASHBOARDS.student;
      } catch (err) {
        const msg = err.message && err.message.toLowerCase().includes('expired')
          ? 'El código expiró. Reenvía uno nuevo.'
          : 'Código incorrecto. Intenta de nuevo.';
        showMsg(2, msg, true);
        setLoading('codeBtn', false, 'Acceder');
        resetCodeBoxes();
        setTimeout(() => document.querySelectorAll('.code-box')[0].focus(), 80);
      }
    }

    // ── Resend with 30s cooldown ─────────────────────────────
    let resendCountdown = null;

    async function handleResend() {
      clearMsg(2);
      const resendBtn   = document.getElementById('resendBtn');
      const resendTimer = document.getElementById('resendTimer');

      resendBtn.disabled = true;
      resendBtn.style.display = 'none';
      resendTimer.style.display = 'inline';

      let secs = 30;
      resendTimer.textContent = `Reenviar en ${secs}s`;

      try {
        const { error } = await sb.auth.signInWithOtp({
          email: currentEmail,
          options: { shouldCreateUser: true }
        });
        if (error) throw error;
        showMsg(2, 'Código reenviado. Revisa tu correo.', false);
      } catch (err) {
        showMsg(2, err.message || 'No pudimos reenviar el código.', true);
      }

      resendCountdown = setInterval(() => {
        secs -= 1;
        resendTimer.textContent = `Reenviar en ${secs}s`;
        if (secs <= 0) {
          clearInterval(resendCountdown);
          resendTimer.style.display = 'none';
          resendBtn.style.display = 'inline';
          resendBtn.disabled = false;
        }
      }, 1000);
    }

    // ── Init ─────────────────────────────────────────────────
    initCodeBoxes();
  </script>
</body>
</html>
